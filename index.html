// 黑洞模式专用吞噬：无无敌帧门控、不触发晋级（已满级），仅计分+计数+吸入特效
function eatBlackholeDevour(e){
  if(e.eaten) return;
  e.eaten=true;
  const lv=Math.max(0,eatBodyLevel(e.kind));
  const sc=eatScore(lv);
  EAT.player.score+=sc;
  EAT.bhCount++;
  EAT_FX.push({x:e.x,y:e.y,r:e.r,kind:e.kind,ttl:0.4});
  S.buy(); boom(e.x,e.y,'#cfe8ff',false);
  eatFloat(e.x,e.y,'+'+sc,'#ffe9a8');
}

// 供给主流 update() 调用
function eatUpdate(dt){
  EAT.t+=dt;
  if(EAT.shake>0) EAT.shake=Math.max(0,EAT.shake-dt*30);
  if(EAT.slow>0) EAT.slow=Math.max(0,EAT.slow-dt);
  if(EAT.inv>0) EAT.inv-=dt;
  // 晋级特效更新：扩散光环衰减 / 全屏柔光衰减
  for(let i=EAT.rings.length-1;i>=0;i--){
    const rg=EAT.rings[i]; rg.ttl-=dt;
    if(rg.ttl<=0) EAT.rings.splice(i,1);
  }
  if(EAT.flash>0) EAT.flash=Math.max(0,EAT.flash-dt*2.2);
  const p=EAT.player;
  // 满级黑洞模式：持续吸附全场天体并吞噬（永不结束的通关动画）
  if(EAT.blackhole){
    EAT.bhT+=dt;
    const pr=eatBodyRadius(p.kind);
    // 黑洞缓慢呼吸膨胀（视觉）
    p.scaleV=Math.max(p.scaleV,0.5);
    // 引力常数：越近越强（1/d 衰减），封顶避免数值爆炸，整体够强以吸附全场
    const G0=90000, gMax=1600, vMax=1100;
    const devour=(arr)=>{
      for(const e of arr){
        const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
        const g=clamp(G0/d,0,gMax);
        e.vx+=dx/d*g*dt; e.vy+=dy/d*g*dt;
        const sp=Math.hypot(e.vx,e.vy);
        if(sp>vMax){ e.vx=e.vx/sp*vMax; e.vy=e.vy/sp*vMax; }
        e.x+=e.vx*dt; e.y+=e.vy*dt; e.t+=dt;
        if(d<pr+e.r*0.6){ eatBlackholeDevour(e); }
      }
    };
    devour(EAT.foods); devour(EAT.threats); devour(EAT.cores);
    // 清理已吞噬
    EAT.foods=EAT.foods.filter(f=>!f.eaten);
    EAT.threats=EAT.threats.filter(t2=>!t2.eaten);
    EAT.cores=EAT.cores.filter(c=>!c.eaten);
    // 吸入特效衰减
    for(let i=EAT_FX.length-1;i>=0;i--){ const fx=EAT_FX[i]; fx.ttl-=dt; if(fx.ttl<=0) EAT_FX.splice(i,1); }
    // 相机缓动归位（黑洞基本静止）
    EAT.cam.x+=(p.x-W/2-EAT.cam.x)*(1-Math.exp(-4*dt));
    EAT.cam.y+=(p.y-H/2-EAT.cam.y)*(1-Math.exp(-4*dt));
    // 持续补充天体，让吞噬永不停歇
    eatStreamWorld();
    return;
  }
  // 晋级黑洞后的超长通关动画：期间冻结操作，播放膨胀吸纳视觉，倒计时结束进结算
  if(EAT.winSoon>0){
    EAT.winSoon-=dt;
    // 持续扩散粒子 + 缓慢膨胀 + 背景暗化
    p.scaleV=Math.max(p.scaleV, 1.2);
    p.scale=1+p.scaleV;
    if(Math.random()<0.6){
      const a=Math.random()*TAU, rr0=rand(20,90);
      G.particles.push({x:p.x+Math.cos(a)*rr0,y:p.y+Math.sin(a)*rr0,
        vx:Math.cos(a)*-120,vy:Math.sin(a)*-120,life:rand(0.5,1.2),max:1,size:rand(2,5),color:'#ffe9a8'});
    }
    EAT.tune=Math.min(1,EAT.tune+dt*0.3);
    if(EAT.winSoon<=0){ eatWin(); }
    return;
  }
  // 牵引拖拽：目标速度模型（速度封顶 + 指数趋近 → 转弯平滑不甩、松手快速停下）
  let tvx=0, tvy=0;
  if(EAT.dragging){
    const dx=EAT.dragging.lx-p.x, dy=EAT.dragging.ly-p.y;
    const d=Math.hypot(dx,dy)||1;
    const sp=Math.min(d*1.5, 260); // 拖越远目标速度越快，封顶 260
    tvx=(dx/d)*sp; tvy=(dy/d)*sp;
  }
  // 速度向目标指数趋近：拖拽中 k=2.8/s（跟手但不甩），松手 k=5/s（快速停下）
  const kk=EAT.dragging?2.8:5.0;
  const kf=1-Math.exp(-kk*dt);
  p.vx+=(tvx-p.vx)*kf;
  p.vy+=(tvy-p.vy)*kf;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  // 无边界宇宙：玩家不受世界边界限制，可飞向任意方向
  const pr=eatBodyRadius(p.kind);
  // 相机平滑跟随：玩家大致保持在屏幕中央（无边界，不做钳制）
  const tcx=p.x-W/2, tcy=p.y-H/2;
  const ck=1-Math.exp(-4.0*dt);
  EAT.cam.x+=(tcx-EAT.cam.x)*ck;
  EAT.cam.y+=(tcy-EAT.cam.y)*ck;
  // 缩放回弹
  if(p.scaleV>0){ p.scaleV=Math.max(0,p.scaleV-dt*2); }
  p.scale=1+p.scaleV*0.5;
  // intro 阶段只移动、不吞噬碰撞
  if(EAT.state==='intro'){
    if(EAT.t>1.4){ EAT.state='play'; }
    for(const f of EAT.foods){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.t+=dt; } // 食物轻微漂移即可
    return;
  }
  // 食物/威胁/星核移动 + 简单 AI（高级天体仅在玩家附近追击）
  for(const f of EAT.foods){
    f.x+=f.vx*dt; f.y+=f.vy*dt; f.t+=dt;
    if(Math.hypot(f.x-p.x,f.y-p.y)<pr+f.r){ eatDoConsume(f.kind,f); }
  }
  for(const t2 of EAT.threats){
    const elv=eatBodyLevel(t2.kind);
    // 高级天体：仅在玩家附近 700px 内缓慢朝玩家漂移（有压迫感但不会全图围堵）
    if(elv>p.idx){
      const dx=p.x-t2.x, dy=p.y-t2.y, d=Math.hypot(dx,dy)||1;
      if(d<700){
        t2.vx+=(dx/d*16-t2.vx)*Math.min(1,dt*0.8);
        t2.vy+=(dy/d*16-t2.vy)*Math.min(1,dt*0.8);
      } else {
        // 远处随机游走
        t2.vx+=(-t2.vx*0.3)*dt; t2.vy+=(-t2.vy*0.3)*dt;
      }
    }
    t2.x+=t2.vx*dt; t2.y+=t2.vy*dt; t2.t+=dt;
    if(Math.hypot(t2.x-p.x,t2.y-p.y)<pr+t2.r){ eatDoConsume(t2.kind,t2); }
  }
  for(const c of EAT.cores){
    c.x+=c.vx*dt; c.y+=c.vy*dt; c.t+=dt;
    if(Math.hypot(c.x-p.x,c.y-p.y)<pr+c.r){ eatDoConsume('core',c); }
  }
  // 清理已吃
  EAT.foods=EAT.foods.filter(f=>!f.eaten);
  EAT.threats=EAT.threats.filter(t2=>!t2.eaten);
  EAT.cores=EAT.cores.filter(c=>!c.eaten);
  // 吸入特效更新（缩小消散）
  for(let i=EAT_FX.length-1;i>=0;i--){
    const fx=EAT_FX[i]; fx.ttl-=dt;
    if(fx.ttl<=0) EAT_FX.splice(i,1);
  }
  // 流式世界：以玩家为圆心的活动盘内维持天体数量，超出回收半径的删除
  eatStreamWorld();
  // 背景色调渐变（太阳系暖色 → 恒星深空冷色）
  if(EAT.tune>0 && EAT.tune<1) EAT.tune=Math.min(1,EAT.tune+dt*0.35);
}

// 无边界流式世界：以玩家为圆心的活动盘内维持天体数量，远处自动回收，星星/星云跟着玩家铺
function eatStreamWorld(){
  const p=EAT.player;
  // 活动盘内计数
  let nF=0, nT=0, nC=0;
  for(const f of EAT.foods){ if(Math.hypot(f.x-p.x,f.y-p.y)<EAT_ACTIVE_R) nF++; }
  for(const t2 of EAT.threats){ if(Math.hypot(t2.x-p.x,t2.y-p.y)<EAT_ACTIVE_R) nT++; }
  for(const c of EAT.cores){ if(Math.hypot(c.x-p.x,c.y-p.y)<EAT_ACTIVE_R) nC++; }
  // 维持目标数量（玩家附近持续补充，保证视野内总有食物）
  if(nF<55) spawnEatFood(10, EAT_ACTIVE_R);
  if(nT<11) spawnEatThreat(3, EAT_ACTIVE_R);
  if(nC<4 && Math.random()<0.02) spawnEatCore(1, EAT_ACTIVE_R);
  // 回收超出回收半径的实体（防止无限增长）
  if(EAT.foods.length>220) EAT.foods=EAT.foods.filter(f=>Math.hypot(f.x-p.x,f.y-p.y)<EAT_RECYCLE_R);
  if(EAT.threats.length>60) EAT.threats=EAT.threats.filter(t2=>Math.hypot(t2.x-p.x,t2.y-p.y)<EAT_RECYCLE_R);
  if(EAT.cores.length>20) EAT.cores=EAT.cores.filter(c=>Math.hypot(c.x-p.x,c.y-p.y)<EAT_RECYCLE_R);
  // 远方太阳地标：玩家晋级到太阳之前，天际始终有一个「太阳」可循（视口边缘提示会标出方向）
  if(EAT.player.idx<9){
    let hasSun=false;
    for(const t2 of EAT.threats){ if(t2.kind==='sun'){ hasSun=true; break; } }
    if(!hasSun){
      // 在玩家 2500-3500px 方向生成（既超出活动盘 2400 让边缘提示可见，又在回收半径 3600 内避免永被回收）
      const a=rand(0,TAU), d=rand(2500,3500);
      const x=EAT.player.x+Math.cos(a)*d, y=EAT.player.y+Math.sin(a)*d;
      EAT.threats.push(eatSpawnEntity('sun',x,y));
    }
  }
  // 星星流式：环形带内保持数量，玩家移动后远处删除、新处补充
  if(EAT.stars.length>EAT_STAR_N*1.6) EAT.stars=EAT.stars.filter(s=>Math.hypot(s.x-p.x,s.y-p.y)<EAT_STAR_R);
  const needS=EAT_STAR_N-EAT.stars.length;
  for(let i=0;i<needS;i++){
    const a=rand(0,TAU), d=Math.sqrt(Math.random())*EAT_STAR_R;
    EAT.stars.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:rand(0.4,1.7),tw:rand(0,TAU),sp:rand(6,18)});
  }
  // 星云流式
  if(EAT.nebulae.length>EAT_NEB_N*1.6) EAT.nebulae=EAT.nebulae.filter(n=>Math.hypot(n.x-p.x,n.y-p.y)<EAT_NEB_R);
  const needN=EAT_NEB_N-EAT.nebulae.length;
  for(let i=0;i<needN;i++){
    const a=rand(0,TAU), d=Math.sqrt(Math.random())*EAT_NEB_R;
    EAT.nebulae.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:rand(120,260),
      c:['rgba(150,80,220,0.16)','rgba(60,180,220,0.13)','rgba(255,120,80,0.12)'][i%3]});
  }
}

// 2D 精美天体绘制（复用星空关纹理绘制思路，独立实现避免破坏）
function eatDrawBody(c,x,y,kind,r,t,opts){
  opts=opts||{};
  const col=eatBodyCol(kind);
  const isBH=kind==='blackhole', isSun=kind==='sun', isRed=kind==='redgiant';
  const isSaturn=kind==='saturn';
  const R=r;
  c.save(); c.translate(x,y);
  const bob=Math.sin(t*2.2)*1.5;
  const roll=t*0.5;
  c.translate(0,bob);
  // 光晕
  if(isSun||isRed){
    const pc=isSun?'rgba(255,190,80,':(isRed?'rgba(255,120,60,':'rgba(150,190,255,');
    const g=c.createRadialGradient(0,0,R*0.5,0,0,R*2.2);
    g.addColorStop(0,pc+'0.55)'); g.addColorStop(1,pc+'0)');
    c.fillStyle=g; c.fillRect(-R*2.3,-R*2.3,R*4.6,R*4.6);
  }
  // 黑洞吸积盘 + 引力透镜
  if(isBH){
    // 吸积盘（亮环）
    const dg=c.createLinearGradient(-R*1.6,0,R*1.6,0);
    dg.addColorStop(0,'rgba(255,180,60,0)'); dg.addColorStop(0.5,'rgba(255,200,90,0.9)'); dg.addColorStop(1,'rgba(255,180,60,0)');
    c.fillStyle=dg;
    c.save(); c.rotate(-0.35);
    c.beginPath(); c.ellipse(0,0,R*1.6,R*0.55,0,0,TAU); c.fill();
    c.restore();
    // 事件视界（黑球）
    c.fillStyle='#000'; c.beginPath(); c.arc(0,0,R*0.8,0,TAU); c.fill();
    // 光子环
    c.strokeStyle='rgba(255,220,140,0.9)'; c.lineWidth=2.5;
    c.beginPath(); c.arc(0,0,R*0.86,0,TAU); c.stroke();
    c.strokeStyle='rgba(160,120,255,0.5)'; c.lineWidth=1.2;
    c.beginPath(); c.arc(0,0,R*0.9,0,TAU); c.stroke();
    c.restore();
    return;
  }
  // 土星环（画在球后）
  if(isSaturn){
    c.strokeStyle='rgba(238,205,150,0.95)'; c.lineWidth=Math.max(3,R*0.16);
    c.beginPath(); c.ellipse(0,0,R*1.9,R*0.55,-0.32,0,TAU); c.stroke();
    c.strokeStyle='rgba(255,246,214,0.85)'; c.lineWidth=Math.max(1.6,R*0.09);
    c.beginPath(); c.ellipse(0,0,R*1.55,R*0.45,-0.32,0,TAU); c.stroke();
  }
  // 星体（径向渐变受光）
  const g=c.createRadialGradient(-R*0.3,-R*0.4,R*0.15,0,0,R*1.05);
  g.addColorStop(0,col[0]); g.addColorStop(1,col[1]);
  c.fillStyle=g;
  c.beginPath(); c.arc(0,0,R,0,TAU); c.fill();
  c.strokeStyle='rgba(0,0,0,0.35)'; c.lineWidth=1.4; c.stroke();
  // 纹理
  c.save(); c.beginPath(); c.arc(0,0,R,0,TAU); c.clip();
  eatDrawBodyTexture(c,kind,R,roll);
  c.restore();
  // 光芒射线（太阳/红巨星/白矮星/中子星）
  if(isSun||isRed||kind==='whitedwarf'||kind==='neutron'){
    c.save(); c.rotate(t*(kind==='neutron'?2.2:0.4));
    const rays=kind==='neutron'?4:12;
    c.strokeStyle=kind==='neutron'?'rgba(180,240,255,0.85)':(isRed?'rgba(255,170,90,0.7)':'rgba(255,220,130,0.8)');
    c.lineWidth=3;
    for(let i=0;i<rays;i++){
      const a=i*TAU/rays + (kind==='neutron'?t*3:0);
      c.beginPath();
      c.moveTo(Math.cos(a)*(R+3),Math.sin(a)*(R+3));
      c.lineTo(Math.cos(a)*(R+9),Math.sin(a)*(R+9));
      c.stroke();
    }
    c.restore();
  }
  // 黑洞已 return；其余画脸（可爱，正向）
  const fR=R*0.32;
  const eyeY=-R*0.12;
  c.fillStyle='#fff';
  c.beginPath(); c.ellipse(-R*0.36,eyeY,fR,fR*1.05,0,0,TAU); c.fill();
  c.beginPath(); c.ellipse(R*0.36,eyeY,fR,fR*1.05,0,0,TAU); c.fill();
  c.fillStyle='#241a10';
  c.beginPath(); c.arc(-R*0.36+Math.sin(t*3)*R*0.04,eyeY,fR*0.45,0,TAU); c.fill();
  c.beginPath(); c.arc(R*0.36+Math.cos(t*3)*R*0.04,eyeY,fR*0.45,0,TAU); c.fill();
  c.strokeStyle='#241a10'; c.lineWidth=2;
  c.beginPath(); c.arc(0,R*0.3,fR*0.55,0.15*Math.PI,0.85*Math.PI); c.stroke();
  c.restore();
}
function eatDrawBodyTexture(c,kind,R,roll){
  // 小行星：不规则多坑
  if(kind==='asteroid'){
    c.fillStyle='rgba(90,84,74,0.55)';
    for(let i=0;i<7;i++){
      const a=i*2.1+roll, rr0=(Math.sin(i*2.9)*0.5+0.5)*R*0.66;
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,R*(0.09+0.05*((i*3)%4)/4),0,TAU); c.fill();
    }
  }
  // 月球：灰坑 + 辐射纹
  else if(kind==='moon'){
    for(let i=0;i<9;i++){
      const a=i*1.25+roll*0.4, rr0=(Math.sin(i*2.7)*0.5+0.5)*R*0.64;
      c.fillStyle='rgba(140,140,150,0.6)';
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,R*(0.06+0.08*((i*5)%4)/4),0,TAU); c.fill();
      c.fillStyle='rgba(240,240,245,0.4)';
      c.beginPath(); c.arc(Math.cos(a)*rr0-1,Math.sin(a)*rr0-1,R*0.03,0,TAU); c.fill();
    }
  }
  // 水星：陨坑
  else if(kind==='mercury'){
    c.fillStyle='rgba(110,96,80,0.7)';
    for(let i=0;i<11;i++){
      const a=i*1.9+roll*0.5, rr0=(Math.sin(i*2.3)*0.5+0.5)*R*0.68;
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,R*(0.08+0.07*((i*7)%5)/5),0,TAU); c.fill();
    }
  }
  // 火星：火山暗斑 + 极冠
  else if(kind==='mars'){
    c.fillStyle='rgba(110,45,22,0.7)';
    c.beginPath(); c.ellipse(-R*0.28+roll*2,R*0.18,R*0.28,R*0.2,0,0,TAU); c.fill();
    c.beginPath(); c.ellipse(R*0.32-roll*2,-R*0.26,R*0.22,R*0.16,0,0,TAU); c.fill();
    c.fillStyle='rgba(255,245,235,0.95)';
    c.beginPath(); c.ellipse(-R*0.32,-R*0.62,R*0.34,R*0.15,-0.2,0,TAU); c.fill();
    c.beginPath(); c.ellipse(R*0.3,R*0.66,R*0.26,R*0.11,0.2,0,TAU); c.fill();
  }
  // 金星：漩涡云带
  else if(kind==='venus'){
    for(let i=0;i<5;i++){
      const yy=-R*0.75+i*R*0.4+(Math.sin(roll*1.3+i)*R*0.12);
      c.strokeStyle='rgba(190,140,50,0.55)'; c.lineWidth=Math.max(2,R*0.12);
      c.beginPath(); c.moveTo(-R,yy); c.quadraticCurveTo(0,yy+R*0.35*Math.sin(roll+i),R,yy); c.stroke();
    }
  }
  // 地球：大陆 + 云带
  else if(kind==='earth'){
    c.fillStyle='rgba(60,150,70,0.9)';
    c.beginPath(); c.ellipse(-R*0.2+roll*2,R*0.16,R*0.34,R*0.23,0.3,0,TAU); c.fill();
    c.beginPath(); c.ellipse(R*0.26-roll*2,-R*0.26,R*0.25,R*0.17,-0.4,0,TAU); c.fill();
    c.strokeStyle='rgba(255,255,255,0.7)'; c.lineWidth=Math.max(1.6,R*0.07);
    for(let i=0;i<3;i++){
      const yy=-R*0.6+i*R*0.55+(Math.sin(roll+i*2)*4);
      c.beginPath(); c.moveTo(-R,yy); c.quadraticCurveTo(0,yy+R*0.15*Math.sin(roll+i),R,yy); c.stroke();
    }
    c.fillStyle='rgba(255,255,255,0.85)';
    c.beginPath(); c.ellipse(0,-R*0.92,R*0.5,R*0.15,0,0,TAU); c.fill();
  }
  // 海王星：深蓝带 + 大暗斑
  else if(kind==='neptune'){
    c.fillStyle='rgba(50,110,200,0.5)';
    for(let i=0;i<6;i++){
      const y=-R*0.85+i*R*0.34;
      c.fillRect(-R,y,R*2,Math.max(3,R*0.1));
    }
    c.fillStyle='rgba(20,60,140,0.7)';
    c.beginPath(); c.ellipse(roll%R-R*0.18,R*0.16,R*0.2,R*0.13,-0.3,0,TAU); c.fill();
  }
  // 天王星：淡青竖带
  else if(kind==='uranus'){
    c.fillStyle='rgba(80,180,220,0.55)';
    for(let i=0;i<6;i++){
      const x=-R+i*R*0.36;
      c.fillRect(x,-R,Math.max(4,R*0.14),R*2);
    }
    c.fillStyle='rgba(230,250,255,0.5)';
    c.beginPath(); c.ellipse(0,-R*0.9,R*0.55,R*0.14,0,0,TAU); c.fill();
  }
  // 土星：金带
  else if(kind==='saturn'){
    c.fillStyle='rgba(215,175,110,0.55)';
    for(let i=0;i<6;i++){
      const y=-R*0.85+i*R*0.33+(Math.sin(roll+i)*3);
      c.fillRect(-R,y,R*2,Math.max(3,R*0.13));
    }
  }
  // 木星：云带 + 大红斑
  else if(kind==='jupiter'){
    const bands=[['rgba(205,150,90,0.7)',0.2],['rgba(150,95,55,0.55)',0.12],['rgba(230,195,140,0.65)',0.16],['rgba(165,110,65,0.6)',0.14],['rgba(120,80,50,0.5)',0.12],['rgba(215,170,115,0.7)',0.18]];
    for(let i=0;i<bands.length;i++){
      const y=-R*0.88+i*R*0.29+(Math.sin(roll*0.8+i)*R*0.02);
      c.fillStyle=bands[i][0]; c.fillRect(-R,y,R*2,Math.max(3,R*bands[i][1]));
    }
    c.fillStyle='rgba(215,80,50,0.95)';
    c.beginPath(); c.ellipse(roll%R-R*0.22,R*0.1,R*0.3,R*0.19,-0.3,0,TAU); c.fill();
    c.fillStyle='rgba(255,170,120,0.6)';
    c.beginPath(); c.ellipse(roll%R-R*0.22,R*0.1,R*0.2,R*0.11,-0.3,0,TAU); c.fill();
  }
  // 太阳：黑子 + 米粒
  else if(kind==='sun'){
    c.fillStyle='rgba(200,85,20,0.75)';
    c.beginPath(); c.arc(-R*0.2+roll*3,R*0.08,R*0.16,0,TAU); c.fill();
    c.fillStyle='rgba(255,150,60,0.7)';
    c.beginPath(); c.arc(-R*0.2+roll*3,R*0.08,R*0.08,0,TAU); c.fill();
    c.fillStyle='rgba(255,230,150,0.25)';
    for(let i=0;i<16;i++){
      const a=i*2.7+roll, rr0=(Math.sin(i*1.9)*0.5+0.5)*R*0.85;
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,Math.max(1,R*0.02),0,TAU); c.fill();
    }
  }
  // 红巨星：暗斑 + 对流皱纹
  else if(kind==='redgiant'){
    c.fillStyle='rgba(150,50,20,0.5)';
    for(let i=0;i<8;i++){
      const a=i*1.6+roll, rr0=(Math.sin(i*2.2)*0.5+0.5)*R*0.7;
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,R*0.12,0,TAU); c.fill();
    }
    c.strokeStyle='rgba(255,200,140,0.35)'; c.lineWidth=Math.max(1.5,R*0.04);
    for(let i=0;i<6;i++){
      const a=i*1.1+roll, rr0=R*0.45;
      c.beginPath(); c.arc(0,0,rr0,a,a+R*0.1); c.stroke();
    }
  }
  // 白矮星：高亮核心
  else if(kind==='whitedwarf'){
    c.fillStyle='rgba(255,255,255,0.8)';
    c.beginPath(); c.arc(0,0,R*0.4,0,TAU); c.fill();
  }
  // 中子星：脉冲斑
  else if(kind==='neutron'){
    c.fillStyle='rgba(140,240,255,0.9)';
    c.beginPath(); c.arc(-R*0.2,R*0.1,R*0.12,0,TAU); c.fill();
    c.beginPath(); c.arc(R*0.2,-R*0.1,R*0.12,0,TAU); c.fill();
  }
}

// 星核绘制（回血）
function eatDrawCore(c,x,y,r,t){
  c.save(); c.translate(x,y);
  const pu=1+0.15*Math.sin(t*5);
  const g=c.createRadialGradient(0,0,r*0.2,0,0,r*1.8*pu);
  g.addColorStop(0,'rgba(140,255,170,0.65)'); g.addColorStop(1,'rgba(140,255,170,0)');
  c.fillStyle=g; c.fillRect(-r*2,-r*2,r*4,r*4);
  c.fillStyle='#a8ffb8'; c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
  c.strokeStyle='#1a8a3a'; c.lineWidth=1.5; c.stroke();
  c.fillStyle='#ffffff';
  // 心形
  c.save(); c.scale(r/9,r/9);
  c.beginPath();
  c.moveTo(0,3);
  c.bezierCurveTo(-5,-2,-8,-1,-8,2);
  c.bezierCurveTo(-8,4,-4,7,0,8);
  c.bezierCurveTo(4,7,8,4,8,2);
  c.bezierCurveTo(8,-1,5,-2,0,3);
  c.closePath(); c.fill();
  c.restore();
  c.restore();
}


// ---------- 第 5 关 渲染 ----------
// 心形路径（中心在 x,y，半宽约 s*0.5）
function heartPath(c,x,y,s){
  c.beginPath();
  c.moveTo(x, y + s*0.30);
  c.bezierCurveTo(x - s*0.5, y - s*0.10, x - s*0.5, y + s*0.35, x, y + s*0.62);
  c.bezierCurveTo(x + s*0.5, y + s*0.35, x + s*0.5, y - s*0.10, x, y + s*0.30);
  c.closePath();
}
// 单颗心：mode 1=满 0.5=半 0=空（支持半格血显示）
function eatDrawHeart(x,y,s,mode){
  const col='#ff4d5e';
  ctx.save();
  if(mode===0){
    heartPath(ctx,x,y,s);
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fill();
    ctx.strokeStyle='rgba(255,120,130,0.45)'; ctx.lineWidth=1.4; ctx.stroke();
  } else {
    heartPath(ctx,x,y,s);
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fill();
    if(mode===0.5){
      ctx.save(); ctx.beginPath(); ctx.rect(x - s*0.55, y - s*0.7, s*0.55, s*1.4); ctx.clip();
      heartPath(ctx,x,y,s); ctx.fillStyle=col; ctx.fill();
      ctx.restore();
    } else {
      heartPath(ctx,x,y,s); ctx.fillStyle=col; ctx.fill();
    }
    heartPath(ctx,x,y,s);
    ctx.strokeStyle= mode===1 ? 'rgba(255,255,255,0.6)' : col;
    ctx.lineWidth=1.4; ctx.stroke();
  }
  ctx.restore();
}
// 心槽（按 maxHp 自适应排布，支持半颗心）
function drawHearts(x0,y,p){
  const n=p.maxHp;
  const maxW=300; // 占用 150..450 的水平区间
  const step=Math.min(22, maxW/n);
  const s=step*0.8;
  let x=x0;
  for(let i=0;i<n;i++){
    const mode = p.hp>=i+1 ? 1 : (p.hp>=i+0.5 ? 0.5 : 0);
    eatDrawHeart(x,y,s,mode);
    x+=step;
  }
}
function eatDrawBackground(t){
  // 背景色调随阶段渐变：太阳系暖紫 → 恒星深空冷蓝（屏幕坐标渐变）
  const tune=EAT.tune;
  const r1=lerpC(10,6,tune), g1=lerpC(12,4,tune), b1=lerpC(34,24,tune);
  const r2=lerpC(34,16,tune), g2=lerpC(20,12,tune), b2=lerpC(64,52,tune);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgb('+r1+','+g1+','+b1+')');
  g.addColorStop(1,'rgb('+r2+','+g2+','+b2+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const cx=EAT.cam.x, cy=EAT.cam.y;
  // 星云（世界坐标，只画视口内的）
  for(const n of EAT.nebulae){
    const nx=n.x-cx, ny=n.y-cy;
    if(nx<-n.r*2||nx>W+n.r*2||ny<-n.r*2||ny>H+n.r*2) continue;
    const ng=ctx.createRadialGradient(nx,ny,5,nx,ny,n.r);
    ng.addColorStop(0,n.c); ng.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ng; ctx.fillRect(nx-n.r,ny-n.r,n.r*2,n.r*2);
  }
  // 星星（世界坐标，只画视口内的）
  for(const s of EAT.stars){
    const sx=s.x-cx, sy=s.y-cy;
    if(sx<-2||sx>W+2||sy<-2||sy>H+2) continue;
    const a=0.3+0.7*Math.abs(Math.sin(t*0.8+s.tw));
    ctx.globalAlpha=a;
    ctx.fillStyle='#dfe9ff';
    ctx.fillRect(sx,sy,s.r,s.r);
  }
  ctx.globalAlpha=1;
}
function lerpC(a,b,t){ return Math.round(a+(b-a)*t); }

function eatDrawHUD(t){
  const p=EAT.player;
  // 顶部栏
  ctx.fillStyle='rgba(10,14,30,0.6)'; ctx.fillRect(0,0,W,64);
  // 当前天体：图标 + 名字
  ctx.textAlign='left'; ctx.textBaseline='middle';
  const ir=eatBodyRadius(p.kind);
  const isc=Math.min(0.42, 15/ir);
  ctx.save(); ctx.translate(26,20); ctx.scale(isc,isc); eatDrawBody(ctx,0,0,p.kind,ir,t,{}); ctx.restore();
  ctx.font='bold 20px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#fff';
  ctx.fillText(EAT_CHAIN[p.idx].name,52,20);

  // 满级(黑洞)：持续吞噬模式专属 HUD
  if(EAT.blackhole){
    ctx.textAlign='center'; ctx.fillStyle='#ffe066'; ctx.font='bold 19px "Microsoft YaHei",sans-serif';
    ctx.fillText('🌌 已化身黑洞 · 持续吞噬整个宇宙', W/2, 22);
    ctx.font='13px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#cfe8ff';
    ctx.fillText('已吞噬分数 '+Math.round(p.score), W/2, 44);
    drawHearts(150,46,p);
    // 返回按钮（避免困在黑洞模式）
    eatBtn(W-146, H-52, 130, 40, '🏠 返回', ()=>{ G.state='select'; setHint(HINT_BATTLE); });
    return;
  }

  // 晋级进度条
  const pxx=210, pw=380, ph=12, py=14;
  ctx.fillStyle='rgba(0,0,0,0.4)'; rr(ctx,pxx,py,pw,ph,6); ctx.fill();
  const prog=clamp(p.score/p.nextScore,0,1);
  ctx.fillStyle='#ffd93d'; rr(ctx,pxx+2,py+2,(pw-4)*prog,ph-4,5); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; rr(ctx,pxx,py,pw,ph,6); ctx.stroke();
  ctx.font='12px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='left';
  ctx.fillText('⭐ '+Math.round(p.score)+' / '+p.nextScore, pxx, py+ph+12);
  // 下一级目标
  if(p.idx<EAT_CHAIN.length-1){
    ctx.textAlign='right'; ctx.fillStyle='rgba(255,233,168,0.9)'; ctx.font='12px "Microsoft YaHei",sans-serif';
    ctx.fillText('下一级：'+EAT_CHAIN[p.idx+1].name, W-14, 20);
  } else {
    ctx.textAlign='right'; ctx.fillStyle='rgba(255,233,168,0.95)'; ctx.font='bold 13px "Microsoft YaHei",sans-serif';
    ctx.fillText('⭐⭐ 已到最大级别！', W-14, 20);
  }
  // 宇宙坐标（无边界宇宙定位用）
  ctx.textAlign='right'; ctx.font='12px "Microsoft YaHei",sans-serif'; ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.fillText('🌌 坐标 '+Math.round(p.x)+', '+Math.round(p.y), W-14, 44);
  // 心槽（第 2 行）
  drawHearts(150,46,p);
  // 图例：绿圈可吞噬 / 红圈危险
  ctx.textAlign='left'; ctx.font='12px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='#6dffae'; ctx.fillText('🟢 绿圈=可吞噬', 470, 46);
  ctx.fillStyle='#ff6a6a'; ctx.fillText('🔴 红圈=危险', 600, 46);
  // 引导提示（intro 阶段）
  if(EAT.state==='intro'){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=clamp(EAT.t,0,1);
    ctx.font='bold 30px "Microsoft YaHei",sans-serif';
    ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=7;
    ctx.strokeText('第 5 关 · 天体吞噬',W/2,170);
    ctx.fillStyle='#fff'; ctx.fillText('第 5 关 · 天体吞噬',W/2,170);
    ctx.font='18px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#ffe066';
    ctx.fillText('拖住那颗带光环的月球（你的天体），吃掉更小的天体！',W/2,210);
    ctx.globalAlpha=1;
  }
  // 开局引导箭头：指向玩家自己的天体（intro 及进入 play 后前几秒持续显示，避免"不知道拖哪个"）
  if(EAT.state!=='win' && EAT.state!=='lose' && EAT.t<5){
    const p2=EAT.player;
    const pr2=eatBodyRadius(p2.kind)*p2.scale;
    // 世界坐标转屏幕坐标（玩家由相机大致居中，直接减相机偏移）
    const px2=p2.x-EAT.cam.x, py2=p2.y-EAT.cam.y;
    const alpha2=clamp(EAT.t<1.4?EAT.t:Math.max(0,5-EAT.t),0,1);
    if(alpha2>0.02){
      ctx.save();
      ctx.globalAlpha=alpha2;
      const bob2=Math.sin(t*4.5)*5;
      // 指示线（从玩家右侧引出）
      const sx=px2+pr2+4, sy=py2+bob2*0.4;
      const ex=px2+pr2+52, ey=py2-26+bob2;
      ctx.strokeStyle='#7ee8ff'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
      // 箭头头部（指向玩家）
      ctx.fillStyle='#7ee8ff';
      ctx.beginPath();
      ctx.moveTo(sx+7,sy+9); ctx.lineTo(sx+15,sy); ctx.lineTo(sx+7,sy-9);
      ctx.closePath(); ctx.fill();
      // 文字
      ctx.font='bold 17px "Microsoft YaHei",sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=5;
      ctx.strokeText('← 你的天体，拖我！',ex+8,ey+4);
      ctx.fillStyle='#7ee8ff'; ctx.fillText('← 你的天体，拖我！',ex+8,ey+4);
      ctx.restore();
    }
  }
  // 阶段 Boss 提示（跨出太阳系）
  if(EAT.lastBoss && EAT.state==='play'){
    const a=clamp(EAT.tune,0,1);
    ctx.globalAlpha=a;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 26px "Microsoft YaHei",sans-serif';
    ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=6;
    ctx.strokeText('🌌 离开太阳系！外面还有更大的天体',W/2,400);
    ctx.fillStyle='#ffe066'; ctx.fillText('🌌 离开太阳系！外面还有更大的天体',W/2,400);
    ctx.globalAlpha=1;
  }
}

// 视口边缘方位提示：视口外的高级天体/星核用箭头标出方向（颜色=天体色，近的亮，里程碑天体带名字）
function drawEatEdgeMarkers(){
  const p=EAT.player;
  const cam=EAT.cam;
  const items=[];
  const mT=64, mB=20, mL=18, mR=18; // 边缘边距（顶部避开 HUD）
  for(const t of EAT.threats){
    const sx=t.x-cam.x, sy=t.y-cam.y;
    if(sx>mL-24&&sx<W-mR+24&&sy>mT-24&&sy<H-mB+24) continue; // 视口内，玩家已可见
    const elv=eatBodyLevel(t.kind);
    const ch=EAT_CHAIN[elv];
    const milestone=!!(ch&&(ch.boss||ch.winLevel||t.kind==='redgiant'||t.kind==='whitedwarf'||t.kind==='neutron'));
    const danger=elv>p.idx, safe=elv<p.idx;
    items.push({sx,sy,kind:t.kind,name:ch?ch.name:t.kind,dist:Math.hypot(t.x-p.x,t.y-p.y),milestone,core:false,danger,safe});
  }
  for(const c of EAT.cores){
    const sx=c.x-cam.x, sy=c.y-cam.y;
    if(sx>mL-24&&sx<W-mR+24&&sy>mT-24&&sy<H-mB+24) continue;
    items.push({sx,sy,kind:'core',name:'星核',dist:Math.hypot(c.x-p.x,c.y-p.y),milestone:false,core:true,danger:false,safe:true});
  }
  if(items.length===0) return;
  // 排序：里程碑天体/星核优先，再按距离（保证太阳等远景总能显示）
  items.sort((a,b)=>{
    const ap=(a.milestone||a.core)?1:0;
    const bp=(b.milestone||b.core)?1:0;
    if(ap!==bp) return bp-ap;
    return a.dist-b.dist;
  });
  const shown=items.slice(0,12);
  for(const it of shown){
    // 颜色按危险度：危险(比我大)=红，可吞噬/星核(比我小或助益)=绿，平级=天体本色
    const col = (it.core||it.safe) ? '#6dffae' : (it.danger ? '#ff5a5a' : eatBodyCol(it.kind)[0]);
    const nameCol = it.danger ? '#ff8a8a' : ((it.safe||it.core) ? '#8effc0' : '#fff');
    const px=clamp(it.sx,mL,W-mR), py=clamp(it.sy,mT,H-mB);
    const ang=Math.atan2(it.sy-py, it.sx-px);
    const near=it.dist<700;
    const alpha=near?1:clamp(0.35+0.6*(1-it.dist/2400),0.35,0.95);
    ctx.save();
    ctx.globalAlpha=alpha;
    // 深色圆底
    ctx.fillStyle='rgba(8,12,26,0.6)';
    ctx.beginPath(); ctx.arc(px,py,it.milestone?13:10,0,TAU); ctx.fill();
    // 天体色小圆
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(px,py,it.core?4:5.5,0,TAU); ctx.fill();
    // 指向目标的箭头
    ctx.save(); ctx.translate(px,py); ctx.rotate(ang);
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(it.milestone?17:13,0); ctx.lineTo(-5,-6); ctx.lineTo(-5,6); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 名字（里程碑/星核加粗，普通威胁小字；危险标红、可吞噬标绿）
    ctx.font=(it.milestone||it.core)?'bold 12px "Microsoft YaHei",sans-serif':'10px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const lx=clamp(it.sx+((it.sx<px)?-30:30),44,W-44);
    const ly=clamp(py+(py<mT+30?-22:18),mT+12,H-mB-8);
    ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=3;
    ctx.strokeText(it.name,lx,ly);
    ctx.fillStyle=nameCol; ctx.fillText(it.name,lx,ly);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// 等级高低环：绿=可吞噬(比我小) 红=危险(比我大)，脉动虚线，解决"分不清谁高谁低"
function eatBodyRing(x,y,r,color,t,seed){
  ctx.save();
  ctx.globalAlpha=0.55+0.35*Math.abs(Math.sin(t*3+(seed||0)));
  ctx.strokeStyle=color; ctx.lineWidth=2.5;
  ctx.setLineDash([5,5]); ctx.lineDashOffset=-t*30+(seed||0);
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
function eatDrawWorld(t){
  const p=EAT.player;
  // 绘制顺序：背景 → 食物(低) → 威胁(高) → 星核 → 玩家
  for(const f of EAT.foods){
    const elv=eatBodyLevel(f.kind);
    eatDrawBody(ctx,f.x,f.y,f.kind,eatBodyRadius(f.kind),t+f.t,{});
    if(!EAT.blackhole && elv<p.idx){ eatBodyRing(f.x,f.y,eatBodyRadius(f.kind)+5,'#6dffae',t,f.t); }
  }
  for(const t2 of EAT.threats){
    const elv=eatBodyLevel(t2.kind);
    eatDrawBody(ctx,t2.x,t2.y,t2.kind,eatBodyRadius(t2.kind),t+t2.t,{});
    if(!EAT.blackhole){
      if(elv>p.idx){ eatBodyRing(t2.x,t2.y,eatBodyRadius(t2.kind)+5,'#ff5a5a',t,t2.t); }
      else if(elv<p.idx){ eatBodyRing(t2.x,t2.y,eatBodyRadius(t2.kind)+5,'#6dffae',t,t2.t); }
    }
  }
  for(const c of EAT.cores){
    eatDrawCore(ctx,c.x,c.y,c.r,t+c.t);
    if(!EAT.blackhole){ eatBodyRing(c.x,c.y,c.r+6,'#6dffae',t,c.t); }
  }
  // 玩家（带拖拽牵引线）
  const pr=eatBodyRadius(p.kind)*p.scale;
  if(EAT.dragging){
    const dx=EAT.dragging.lx-p.x, dy=EAT.dragging.ly-p.y;
    const d=Math.hypot(dx,dy)||1;
    const nx=dx/d, ny=dy/d;
    // 虚线牵引
    ctx.save();
    ctx.strokeStyle='rgba(200,240,255,0.7)'; ctx.lineWidth=2;
    ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(p.x+nx*pr,p.y+ny*pr);
    ctx.lineTo(p.x+dx,p.y+dy);
    ctx.stroke();
    ctx.setLineDash([]);
    // 终点箭头
    const ax=EAT.dragging.lx, ay=EAT.dragging.ly;
    ctx.fillStyle='rgba(200,240,255,0.9)';
    ctx.beginPath(); ctx.arc(ax,ay,5,0,TAU); ctx.fill();
    ctx.restore();
  }
  // 玩家天体（受击闪烁）
  if(EAT.inv>0 && Math.floor(t*20)%2===0){
    ctx.globalAlpha=0.5;
  }
  ctx.save(); ctx.translate(p.x,p.y);
  ctx.scale(p.scale,p.scale);
  ctx.translate(-p.x,-p.y);
  eatDrawBody(ctx,p.x,p.y,p.kind,eatBodyRadius(p.kind),t,{});
  ctx.restore();
  ctx.globalAlpha=1;
  // 玩家常驻高亮：呼吸光环 + 金色旋转虚线环（与满场小行星明显区分，引导拖拽）
  const glowR=pr+10+Math.sin(t*3.2)*3;
  ctx.save();
  ctx.globalAlpha=0.85;
  const gg=ctx.createRadialGradient(p.x,p.y,pr*0.4,p.x,p.y,glowR+12);
  gg.addColorStop(0,'rgba(120,230,255,0)');
  gg.addColorStop(0.72,'rgba(120,230,255,0.30)');
  gg.addColorStop(1,'rgba(120,230,255,0)');
  ctx.fillStyle=gg;
  ctx.beginPath(); ctx.arc(p.x,p.y,glowR+12,0,TAU); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=0.95;
  ctx.strokeStyle='#ffd93d'; ctx.lineWidth=2;
  ctx.setLineDash([7,7]);
  ctx.lineDashOffset=-t*26;
  ctx.beginPath(); ctx.arc(p.x,p.y,glowR,0,TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.globalAlpha=1;
  // 无敌提示圈
  if(EAT.inv>0){
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(p.x,p.y,pr+8,0,TAU); ctx.stroke();
  }
}

function eatRender(t){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(EAT.shake>0) ctx.translate(rand(-EAT.shake,EAT.shake),rand(-EAT.shake,EAT.shake));
  eatDrawBackground(t);
  // 世界坐标偏移：视口跟随相机
  ctx.translate(-EAT.cam.x,-EAT.cam.y);
  eatDrawWorld(t);
  // 晋级扩散光环（世界坐标，画在天体之上）
  for(const rg of EAT.rings){
    const k=clamp(rg.ttl/rg.life,0,1);
    const rr2=6+(1-k)*(rg.big?150:95);
    ctx.globalAlpha=k*0.85;
    ctx.strokeStyle=rg.big?'rgba(255,233,168,0.75)':'#ffe9a8';
    ctx.lineWidth=rg.big?3:4;
    ctx.beginPath(); ctx.arc(rg.x,rg.y,rr2,0,TAU); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // 吸入特效（被吞天体缩小消散）
  for(const fx of EAT_FX){
    const k=fx.ttl/0.5;
    ctx.globalAlpha=clamp(k,0,1);
    eatDrawBody(ctx,fx.x,fx.y,fx.kind,fx.r*k,t,{});
  }
  ctx.globalAlpha=1;
  // 粒子（世界坐标）
  for(const pt of G.particles){
    const a=clamp(pt.life/pt.max,0,1);
    ctx.globalAlpha=a; ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size*a,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  // 浮动文字（世界坐标）
  for(const f of G.floats){
    const a=clamp(f.life/1,0,1);
    ctx.globalAlpha=a; ctx.fillStyle=f.color; ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=3;
    ctx.font='bold '+(f.size||18)+'px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
    ctx.strokeText(f.str,f.x,f.y-(1-a)*26); ctx.fillText(f.str,f.x,f.y-(1-a)*26);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // HUD 为屏幕坐标（相机恢复后绘制）
  eatDrawHUD(t);
  // 视口边缘方位提示（高级天体/星核在哪个方向）
  if(EAT.state==='play'||EAT.state==='intro') drawEatEdgeMarkers();
  // 晋级全屏金色柔光（屏幕坐标，覆盖 HUD 之上的光效）
  if(EAT.flash>0){
    ctx.globalAlpha=clamp(EAT.flash*0.5,0,1);
    const fg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);
    fg.addColorStop(0,'rgba(255,233,168,0.85)');
    fg.addColorStop(1,'rgba(255,233,168,0)');
    ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  // 晋级黑洞的仪式感动画（吞噬吸纳 + 全屏收缩光晕）
  if(EAT.winSoon>0) eatDrawWinSoon(t);
  if(EAT.blackhole) eatDrawBlackhole(t);
  if(EAT.state==='win') eatDrawWin(t);
  if(EAT.state==='lose') eatDrawLose(t);
}

// 中子星→黑洞 晋级通关动画：全屏向中心吸纳的粒子洪流 + 旋转光环
function eatDrawWinSoon(t){
  const left=EAT.winSoon;
  const total=3.6;
  const prog=1-left/total; // 0→1
  const p=EAT.player;
  // 玩家世界坐标转屏幕坐标（相机偏移）
  const px=p.x-EAT.cam.x, py=p.y-EAT.cam.y;
  // 暗化背景，突出黑洞
  ctx.fillStyle='rgba(0,0,0,'+(0.2+0.5*prog)+')'; ctx.fillRect(0,0,W,H);
  // 向玩家（黑洞）螺旋吸纳的粒子
  for(let i=0;i<70;i++){
    const ang=i*0.55+t*2.2;
    const rr0=(1-prog)*340 + prog*30;
    const x=px+Math.cos(ang)*rr0, y=py+Math.sin(ang)*rr0*0.8;
    ctx.globalAlpha=clamp(1-prog*0.85,0.1,1);
    ctx.fillStyle=i%3===0?'#ffe9a8':'#cfe8ff';
    ctx.beginPath(); ctx.arc(x,y,2.2-prog*1.4,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  // 旋转吸积盘光环
  ctx.save(); ctx.translate(px,py); ctx.rotate(t*1.5);
  const rg=ctx.createLinearGradient(-130,0,130,0);
  rg.addColorStop(0,'rgba(255,180,60,0)'); rg.addColorStop(0.5,'rgba(255,210,100,'+(0.4+0.5*prog)+')'); rg.addColorStop(1,'rgba(255,180,60,0)');
  ctx.strokeStyle=rg; ctx.lineWidth=4+6*prog;
  ctx.beginPath(); ctx.ellipse(0,0,130,40,0,0,TAU); ctx.stroke();
  ctx.restore();
  // 大字
  const a=clamp(prog*2,0,1);
  ctx.globalAlpha=a;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(30+22*prog)+'px "Microsoft YaHei",sans-serif';
  ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=8;
  ctx.strokeText('🌌 吞噬一切，化身黑洞',W/2,H*0.32);
  ctx.fillStyle='#ffe066'; ctx.fillText('🌌 吞噬一切，化身黑洞',W/2,H*0.32);
  ctx.globalAlpha=1;
}

// 满级黑洞：持续通关动画（永不停歇的吸纳洪流 + 旋转吸积盘 + 持久大字）
function eatDrawBlackhole(t){
  const p=EAT.player;
  const px=p.x-EAT.cam.x, py=p.y-EAT.cam.y;
  const pulse=0.5+0.5*Math.sin(t*1.6);
  // 暗化背景，突出黑洞（脉动）
  ctx.fillStyle='rgba(2,2,10,'+(0.45+0.25*pulse)+')'; ctx.fillRect(0,0,W,H);
  // 向玩家螺旋吸纳的粒子洪流（持续不断）
  for(let i=0;i<90;i++){
    const ang=i*0.41+t*2.4+i*0.013;
    const rr0=40+((i*37+t*260)%360);
    const x=px+Math.cos(ang)*rr0, y=py+Math.sin(ang)*rr0*0.82;
    ctx.globalAlpha=clamp(0.25+0.6*(1-rr0/400),0.1,0.9);
    ctx.fillStyle=i%3===0?'#ffe9a8':(i%3===1?'#cfe8ff':'#b69bff');
    ctx.beginPath(); ctx.arc(x,y,2.4,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  // 旋转吸积盘光环（双层，反向旋转）
  ctx.save(); ctx.translate(px,py); ctx.rotate(t*1.6);
  let rg=ctx.createLinearGradient(-150,0,150,0);
  rg.addColorStop(0,'rgba(255,180,60,0)'); rg.addColorStop(0.5,'rgba(255,210,100,0.7)'); rg.addColorStop(1,'rgba(255,180,60,0)');
  ctx.strokeStyle=rg; ctx.lineWidth=5;
  ctx.beginPath(); ctx.ellipse(0,0,150,46,0,0,TAU); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(px,py); ctx.rotate(-t*1.1);
  rg=ctx.createLinearGradient(-110,0,110,0);
  rg.addColorStop(0,'rgba(160,120,255,0)'); rg.addColorStop(0.5,'rgba(180,140,255,0.5)'); rg.addColorStop(1,'rgba(160,120,255,0)');
  ctx.strokeStyle=rg; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0,0,110,34,0,0,TAU); ctx.stroke();
  ctx.restore();
  // 持久大字（带脉动）
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const a=clamp(EAT.bhT*1.5,0,1);
  ctx.globalAlpha=a;
  ctx.font='bold '+(30+6*pulse)+'px "Microsoft YaHei",sans-serif';
  ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=8;
  ctx.strokeText('🌌 已化身黑洞 · 吞噬万物',W/2,H*0.3);
  ctx.fillStyle='#ffe066'; ctx.fillText('🌌 已化身黑洞 · 吞噬万物',W/2,H*0.3);
  ctx.globalAlpha=1;
  ctx.font='18px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#cfe8ff';
  ctx.fillText('已吞噬 '+EAT.bhCount+' 个天体 · 宇宙正在被你吸入',W/2,H*0.3+34);
}

function eatDrawWin(t){
  if(EAT.winT===0) EAT.winT=t;
  const el=t-EAT.winT;
  // 满足感通关动画：星光爆发扩散
  ctx.fillStyle='rgba(8,10,22,'+clamp(0.75,0,1)+')';
  ctx.fillRect(0,0,W,H);
  // 环绕星光
  const cx=W/2, cy=H/2-40;
  const rad=Math.min(el*220, 380);
  for(let i=0;i<40;i++){
    const a=i*TAU/40+el*0.6;
    const r=rad*(0.6+0.4*Math.sin(el*3+i));
    ctx.globalAlpha=clamp(1-el*0.02,0,1);
    ctx.fillStyle='#ffe9a8';
    const sx=cx+Math.cos(a)*r, sy=cy+Math.sin(a)*r*0.7;
    ctx.beginPath(); ctx.arc(sx,sy,2.5,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  // 标题
  const scale=clamp(el/0.6,0,1);
  ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 52px "Microsoft YaHei",sans-serif';
  ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=9;
  ctx.strokeText('🌌 通关！',0,0);
  ctx.fillStyle='#ffe066'; ctx.fillText('🌌 通关！',0,0);
  ctx.restore();
  ctx.font='22px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#fff';
  ctx.textAlign='center'; ctx.fillText('你吞掉了超大质量黑洞！',W/2,cy+70);
  ctx.fillText('成为宇宙之王 🏆',W/2,cy+100);
  // 按钮：重玩 / 返回
  if(el>1.2){
    const by=H-120;
    eatBtn(W/2-130,by,120,50,'重玩',()=>{ eatReset(); EAT.state='intro'; setHint(HINT_EAT); });
    eatBtn(W/2+10,by,120,50,'返回',()=>{ G.state='select'; setHint(HINT_BATTLE); });
  }
}
function eatDrawLose(t){

}
function eatBtn(x,y,w,h,txt,act){
  const hover=G.mouse.x>x&&G.mouse.x<x+w&&G.mouse.y>y&&G.mouse.y<y+h;
  ctx.fillStyle=hover?'#ffe08a':'rgba(255,217,61,0.92)';
  rr(ctx,x,y,w,h,24); ctx.fill();
  ctx.strokeStyle='#8a6a10'; ctx.lineWidth=3; rr(ctx,x,y,w,h,24); ctx.stroke();
  ctx.font='bold 20px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#5a3a00';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,x+w/2,y+h/2+2);
}

// ---------- 第 5 关 输入 ----------
function eatPointerDown(mx,my,id){
  G.mouse.x=mx; G.mouse.y=my;
  // 结算画面按钮（重玩 / 返回）
  if(EAT.state==='win'||EAT.state==='lose'){
    const by=H-120;
    if(mx>W/2-130&&mx<W/2-10&&my>by&&my<by+50){ eatReset(); EAT.state='intro'; setHint(HINT_EAT); S.select(); return; }
    if(mx>W/2+10&&mx<W/2+130&&my>by&&my<by+50){ G.state='select'; setHint(HINT_BATTLE); S.select(); return; }
    return;
  }
  if(EAT.state!=='play' && EAT.state!=='intro') return;
  const p=EAT.player;
  // 按下玩家天体附近一定半径即触发拖拽牵引（指针转世界坐标）
  const pr=eatBodyRadius(p.kind)+26;
  const wmx=mx+EAT.cam.x, wmy=my+EAT.cam.y;
  if(Math.hypot(wmx-p.x,wmy-p.y)<=pr){
    EAT.pointer=id;
    EAT.dragging={lx:wmx,ly:wmy};
  }
}
function eatPointerMove(mx,my,id){
  G.mouse.x=mx; G.mouse.y=my;
  if(EAT.dragging && EAT.pointer===id){
    EAT.dragging.lx=mx+EAT.cam.x; EAT.dragging.ly=my+EAT.cam.y;
  }
}
function eatPointerUp(id){
  if(EAT.pointer===id){
    EAT.pointer=null;
    EAT.dragging=null;
  }
}

function exReset(){

  for(let i=0;i<420;i++){
    const r0=rand(6400,7700);
    EX.belts.push({r0,a:Math.random()*TAU,y:rand(-140,140),size:rand(1.2,3),sp:rand(1,4),c:'#cfe0ff',aA:0.32});

// 第一人称相机基向量（相机位置 + 朝向 yaw/pitch）
function exBasis(){
  const c=EX.cam;
  const px=c.cx, py=c.cy, pz=c.cz;
  const fx=Math.cos(c.pitch)*Math.sin(c.yaw);
  const fy=Math.sin(c.pitch);
  const fz=Math.cos(c.pitch)*Math.cos(c.yaw);
  let rx=-fz, rz=fx, ry=0;
  const rl=Math.sqrt(rx*rx+rz*rz)||1; rx/=rl; rz/=rl;
  let ux=ry*fz-rz*fy, uy=rz*fx-rx*fz, uz=rx*fy-ry*fx;
  const ul=Math.sqrt(ux*ux+uy*uy+uz*uz)||1; ux/=ul; uy/=ul; uz/=ul;
  EX.basis={px,py,pz,fx,fy,fz,rx,ry,rz,ux,uy,uz};
}
function exProject(p){
  const b=EX.basis;
  if(!b) return null;
  const dx=p.x-b.px, dy=p.y-b.py, dz=p.z-b.pz;
  const depth=dx*b.fx+dy*b.fy+dz*b.fz;
  if(depth<3) return null;
  const xc=dx*b.rx+dy*b.ry+dz*b.rz;
  const yc=dx*b.ux+dy*b.uy+dz*b.uz;
  const sc=EX.cam.focal/depth;
  return {x:W/2+xc*sc, y:H/2-yc*sc, scale:sc, depth};
}
function exFloat(x,y,z,str,color){
  const pr=exProject({x,y,z});
  if(pr) floatText(pr.x,pr.y-12,str,color);
}
function exBurst(x,y,z,color,big){
  const pr=exProject({x,y,z});
  if(!pr) return;
  const n=big?40:18;
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU, sp=rand(30,big?300:170);
    G.particles.push({x:pr.x,y:pr.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,life:rand(0.3,big?0.8:0.5),max:1,size:rand(3,big?8:5),color:Math.random()<0.6?color:(Math.random()<0.5?'#ffd166':'#fff')});
  }
  if(big) EX.shake=10;
}

// 更新：入场动画 / 飞船 / 天体 / 停靠 / 收集 / 陨石
function exUpdate(dt){
  EX.time+=dt;
  if(EX.shake>0) EX.shake=Math.max(0,EX.shake-dt*30);
  if(EX.cool>0) EX.cool-=dt;
  if(EX.factT>0) EX.factT-=dt;
  if(EX.accel>0) EX.accel-=dt;
  if(EX.shield>0) EX.shield-=dt;
  if(EX.state==='intro'){
    EX.introT+=dt;
    const k=EX.introT/EX.introDur;
    const e=k<1?k*k*(3-2*k):1; // smoothstep
    const cs=EX.camStart, s=EX.ship;
    EX.cam.cx=cs.x+(s.x-cs.x)*e;
    EX.cam.cy=cs.y+(s.y+30-cs.y)*e;
    EX.cam.cz=cs.z+(s.z-cs.z)*e;
    EX.cam.yaw=cs.yaw+(s.yaw-cs.yaw)*e;
    EX.cam.pitch=cs.pitch+(s.pitch-cs.pitch)*e;
    if(e>=1){ EX.state='fly'; S.select(); }
    return;
  }
  exUpdateShip(dt);
  exUpdateBodies(dt);
  exUpdateStreaks(dt);
  exUpdateDock(dt);
  exUpdateCollect(dt);
  exUpdateAsts(dt);
  if(EX.count>=EX.mainTotal && EX.state==='fly'){ EX.state='win'; S.win(); }
}
function exUpdateShip(dt){
  const s=EX.ship;
  // 左摇杆/键盘 → 移动
  let jx=0, jy=0;
  if(EX.joyMove){
    const dx=EX.joyMove.x-JOY_MOVE.x, dy=EX.joyMove.y-JOY_MOVE.y;
    const r=Math.hypot(dx,dy)||1, m=Math.min(1,r/48);
    jx=(dx/r)*m; jy=(-dy/r)*m;
  }
  if(EX.keys.up) jy=Math.max(jy,1);
  if(EX.keys.down) jy=Math.min(jy,-1);
  if(EX.keys.left) jx=Math.min(jx,-1);
  if(EX.keys.right) jx=Math.max(jx,1);
  const jl=Math.hypot(jx,jy);
  if(jl>1){ jx/=jl; jy/=jl; }
  const f=exCamDir();
  const hf=Math.hypot(f.x,f.z)||1e-6;
  const spd=EX.accel>0?560:260;
  const tvx=(f.x/hf)*jy*spd + (-f.z/hf)*jx*spd;
  const tvz=(f.z/hf)*jy*spd + (f.x/hf)*jx*spd;
  s.vx+=(tvx-s.vx)*Math.min(1,8*dt);
  s.vz+=(tvz-s.vz)*Math.min(1,8*dt);
  if(EX.stun>0){ EX.stun-=dt; s.vx*=0.75; s.vz*=0.75; }
  s.x+=s.vx*dt; s.z+=s.vz*dt;
  s.yaw=EX.cam.yaw; s.pitch=EX.cam.pitch;
  EX.cam.cx=s.x; EX.cam.cy=s.y+30; EX.cam.cz=s.z;
}
function exDiscover(b){
  EX.discovered[b.id]=true;
  if(b.main) EX.count++;
  S.discover();
  exBurst(b.x,b.y,b.z,'#ffe9a8',b.main);
  EX.fact={name:b.name,text:b.fact}; EX.factT=4.6;
}
function exUpdateBodies(dt){
  const s=EX.ship;
  for(const b of EX_BODIES){ b.rot+=dt*0.25; }
  EX_SUN.rot+=dt*0.08;
  for(const b of EX_BODIES){
    if(EX.discovered[b.id]) continue;
    const d=Math.hypot(s.x-b.x,s.y-b.y,s.z-b.z);
    if(d<b.r*5+10) exDiscover(b);
  }
  if(!EX.discovered.sun){
    const d=Math.hypot(s.x,s.y,s.z);
    if(d<EX_SUN.reach) exDiscover(EX_SUN);
  }
}
function exUpdateDock(dt){
  EX.nearPlanet=null;
  if(EX.state!=='fly') return;
  const s=EX.ship;
  const sp=Math.hypot(s.vx,s.vy,s.vz);
  // 关闭商店后需飞离该星球，否则不会再次自动停靠（避免商店反复弹出）
  if(EX.dockBlock){
    const bb=EX_BODIES.find(b=>b.id===EX.dockBlock);
    if(bb && Math.hypot(s.x-bb.x,s.y-bb.y,s.z-bb.z) > bb.r*1.8+18) EX.dockBlock=null;
  }
  let best=null, bestD=1e9;
  for(const b of EX_BODIES){
    if(!EX.discovered[b.id]||b.kind==='moon'||b.id===EX.dockBlock) continue;
    const d=Math.hypot(s.x-b.x,s.y-b.y,s.z-b.z);
    if(d<b.r*1.8+12 && d<bestD){ best=b; bestD=d; }
  }
  EX.nearPlanet=best;
  if(best && sp<14 && EX.cool<=0){
    EX.docked=best; EX.state='dock'; S.select();
  }
}
function exUpdateCollect(dt){
  const s=EX.ship;
  for(const st of EX.stars){
    if(st.got) continue;
    let d=Math.hypot(s.x-st.x,s.y-st.y,s.z-st.z);
    if(EX.shield>0 && d<30){
      st.x+=(s.x-st.x)*6*dt; st.y+=(s.y-st.y)*6*dt; st.z+=(s.z-st.z)*6*dt;
      d=Math.hypot(s.x-st.x,s.y-st.y,s.z-st.z);
    }
    if(d<9){ st.got=true; EX.stardust+=1; S.collect(); exFloat(st.x,st.y,st.z,'+1','#ffe9a8'); }
  }
}
// 速度线（移动风效）：飞船移动时屏幕周边出现流动线条
function exUpdateStreaks(dt){
  const s=EX.ship;
  const sp=Math.hypot(s.vx,s.vy,s.vz);
  let mdx=0, mdy=0;
  exBasis();
  const pA=exProject(s);
  const pB=exProject({x:s.x+s.vx*2, y:s.y+s.vy*2, z:s.z+s.vz*2});
  if(pA&&pB){ mdx=pB.x-pA.x; mdy=pB.y-pA.y; }
  const ml=Math.hypot(mdx,mdy)||1;
  const nx=-mdx/ml, ny=-mdy/ml; // 与运动方向相反
  if(sp>60){
    EX.streakAcc+=Math.min(46, sp*0.35)*dt;
    while(EX.streakAcc>1){
      EX.streakAcc--;
      const a=Math.random()*TAU, rr0=0.35+Math.random()*0.65;
      const px=W/2+Math.cos(a)*W*0.5*rr0;
      const py=H/2+Math.sin(a)*H*0.5*rr0;
      const vv=(120+Math.random()*200)*(sp/260);
      EX.streaks.push({x:px,y:py,nx,ny,vx:nx*vv,vy:ny*vv,life:0.5,len:rand(12,32),a:rand(0.2,0.4)});
    }
  }
  for(const st of EX.streaks){ st.x+=st.vx*dt; st.y+=st.vy*dt; st.life-=dt; }
  EX.streaks=EX.streaks.filter(st=>st.life>0);
}
function exDrawStreaks(){
  for(const st of EX.streaks){
    const a=clamp(st.life/0.5,0,1)*st.a;
    ctx.globalAlpha=a;
    ctx.strokeStyle='#cfe8ff';
    ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(st.x-st.nx*st.len, st.y-st.ny*st.len);
    ctx.lineTo(st.x, st.y);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
// 第一视角机头：底部舷窗 + 机头随俯仰(pitch)上下倾斜，体现飞船 z 轴朝向
function exDrawCockpit(){
  const p=EX.cam.pitch;
  // 底部座舱玻璃暗角
  const gg=ctx.createLinearGradient(0,H-74,0,H);
  gg.addColorStop(0,'rgba(30,45,70,0)'); gg.addColorStop(1,'rgba(18,28,48,0.5)');
  ctx.fillStyle=gg; ctx.fillRect(0,H-74,W,74);
  ctx.save(); ctx.translate(W/2,H-44); ctx.rotate(p*0.5);
  // 机头（楔形，指向视野前方）
  ctx.fillStyle='rgba(78,90,108,0.9)';
  ctx.beginPath(); ctx.moveTo(-48,0); ctx.lineTo(-30,-30); ctx.lineTo(30,-30); ctx.lineTo(48,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(126,140,160,0.92)';
  ctx.beginPath(); ctx.moveTo(-30,-30); ctx.lineTo(0,-84); ctx.lineTo(30,-30); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(176,190,208,0.92)';
  ctx.beginPath(); ctx.moveTo(-16,-34); ctx.lineTo(0,-70); ctx.lineTo(16,-34); ctx.closePath(); ctx.fill();
  // 舷窗
  ctx.fillStyle='rgba(168,224,255,0.55)';
  ctx.beginPath(); ctx.ellipse(0,-38,9,17,0,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(205,235,255,0.8)'; ctx.lineWidth=2; ctx.stroke();
  // 机头灯
  ctx.fillStyle='rgba(255,120,80,0.95)';
  ctx.beginPath(); ctx.arc(0,-66,2.5,0,TAU); ctx.fill();
  ctx.restore();
}
function exUpdateAsts(dt){  const s=EX.ship;
  for(const p of EX.belts){
    p.a+=p.sp*dt/p.r0;
    p.x=Math.cos(p.a)*p.r0; p.z=Math.sin(p.a)*p.r0;
  }
  for(const a of EX.asts){
    a.x+=a.vx*dt; a.z+=a.vz*dt; a.t+=dt;
    const d=Math.hypot(s.x-a.x,s.y-a.y,s.z-a.z);
    if(d<a.r+3){
      if(EX.shield>0){
        exBurst(a.x,a.y,a.z,'#9fd8ff',false);
      }else{
        const dx=s.x-a.x, dy=s.y-a.y, dz=s.z-a.z;
        const l=Math.hypot(dx,dy,dz)||1;
        s.vx=dx/l*260; s.vy=dy/l*110; s.vz=dz/l*260;
        EX.stun=0.7; EX.shake=9; S.explode();
        exBurst(s.x,s.y,s.z,'#ffb45c',true);
      }
    }
  }
}

// 渲染
function exBodyCol(kind){
  const m={
    mercury:['#e9e0cf','#7d7466'], venus:['#fdf3c8','#c89b4a'],
    earth:['#aee3ff','#1d5fae'], mars:['#f2a488','#9c3d22'],
    jupiter:['#f2d3a4','#b07844'], saturn:['#f4e0b4','#c9a15e'],
    uranus:['#cfeee8','#5fa8c4'], neptune:['#8ec6f2','#1c3fa0'],
    pluto:['#f2d9b0','#9c7a52'], moon:['#e6e6e6','#8a8a8a'],
    sun:['#fff3b0','#ff8a2a'],
  };
  return m[kind]||['#fff','#888'];
}
function exRender(t){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(EX.shake>0) ctx.translate(rand(-EX.shake,EX.shake),rand(-EX.shake,EX.shake));
  exDrawSpace(t);
  exBasis();
  exDrawBelts(t);
  // 轨道环线（史诗感：勾勒整个太阳系）
  for(const b of EX_BODIES) if(b.main) exDrawOrbit(b);
  const items=[];
  const addP=(p,f)=>{ const pr=exProject(p); if(pr) items.push({pr,d:f}); };
  addP(EX_SUN,()=>exDrawBody(EX_SUN,EX_SUN.rot,t));
  for(const b of EX_BODIES) addP(b,()=>exDrawBody(b,b.rot,t));
  for(const a of EX.asts) addP(a,()=>exDrawAsteroid(a,t));
  for(const st of EX.stars) if(!st.got) addP(st,()=>exDrawStar(st,t));
  // 第一视角时飞船在镜头内不绘制（接近时淡出）；入场/远景时可见
  const s=EX.ship;
  const camDist=Math.hypot(EX.cam.cx-s.x,EX.cam.cy-s.y,EX.cam.cz-s.z);
  if(camDist>30) addP(s,()=>{ ctx.globalAlpha=clamp((camDist-30)/50,0,1); exDrawShip(t); ctx.globalAlpha=1; });
  items.sort((p,q)=>q.pr.depth-p.pr.depth);
  for(const it of items) it.d();
  ctx.restore();
  if(EX.factT>0 && EX.fact) exDrawFact();
  exDrawHUD(t);
  if(EX.state==='intro') exDrawIntro(t);
  if(EX.state==='fly'){
    // 速度线（移动风效）
    exDrawStreaks();
    // 第一视角准星
    ctx.strokeStyle='rgba(255,233,168,0.75)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(W/2,H/2,5,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2-10,H/2); ctx.lineTo(W/2-4,H/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2+4,H/2); ctx.lineTo(W/2+10,H/2); ctx.stroke();
    // 第一视角飞船机头（随俯仰上下倾斜，体现 z 轴朝向）
    exDrawCockpit();
  }
  if(EX.state==='dock') exDrawStore();
  if(EX.state==='win') exDrawWin();
}
function exDrawSpace(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#030210'); g.addColorStop(0.5,'#0a0820'); g.addColorStop(1,'#170e36');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const n1=ctx.createRadialGradient(150,110,10,150,110,230);
  n1.addColorStop(0,'rgba(150,80,220,0.22)'); n1.addColorStop(1,'rgba(150,80,220,0)');
  ctx.fillStyle=n1; ctx.fillRect(0,0,W,H);
  const n2=ctx.createRadialGradient(660,80,10,660,80,200);
  n2.addColorStop(0,'rgba(60,180,220,0.18)'); n2.addColorStop(1,'rgba(60,180,220,0)');
  ctx.fillStyle=n2; ctx.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){
    const sx=((i*89.7+EX.cam.yaw*400)%W+W)%W;
    const sy=((i*53.3+EX.cam.pitch*260-EX.cam.cy*0.3)%H+H)%H;
    const tw=0.4+0.6*Math.abs(Math.sin(t*0.9+i*1.7));
    ctx.globalAlpha=0.25+0.75*tw;
    ctx.fillStyle=i%6===0?'#ffe9a8':'#dfe9ff';
    if(i%6===0){ ctx.beginPath(); ctx.arc(sx,sy,i%11===0?2:1.4,0,TAU); ctx.fill(); }
    else ctx.fillRect(sx,sy,1.6,1.6);
  }
  ctx.globalAlpha=1;
}
function exDrawOrbit(b){
  const pts=[];
  for(let i=0;i<48;i++){
    const a=i/48*TAU;
    const pr=exProject({x:Math.cos(a)*b.orbit, y:0, z:Math.sin(a)*b.orbit});
    if(pr) pts.push(pr);
  }
  if(pts.length<3) return;
  ctx.strokeStyle='rgba(140,175,255,0.13)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath(); ctx.stroke();
  const pr=exProject({x:b.x,y:b.y,z:b.z});
  if(pr){ ctx.fillStyle='rgba(255,233,168,0.5)'; ctx.beginPath(); ctx.arc(pr.x,pr.y,2.4,0,TAU); ctx.fill(); }
}
function exDrawBelts(t){
  for(const p of EX.belts){
    const pr=exProject(p);
    if(!pr) continue;
    const r=Math.max(0.6, Math.min(9, p.size*pr.scale));
    ctx.globalAlpha=p.aA;
    ctx.fillStyle=p.c;
    ctx.fillRect(pr.x-r, pr.y-r, r*2, r*2);
  }
  ctx.globalAlpha=1;
}

function exDrawBody(b,rot,t){

  const sc=pr.scale, R=b.r*sc;

  if(b.kind==='sun'){
    const pulse=0.35+0.15*Math.sin(t*2);
    const sg=ctx.createRadialGradient(x,y,2,x,y,R*4.2);
    sg.addColorStop(0,'rgba(255,210,90,'+(0.55+pulse)+')');
    sg.addColorStop(0.4,'rgba(255,170,60,0.22)');
    sg.addColorStop(1,'rgba(255,170,60,0)');
    ctx.fillStyle=sg; ctx.fillRect(x-R*4.2,y-R*4.2,R*8.4,R*8.4);
  }
  const col=exBodyCol(b.kind);
  const g=ctx.createRadialGradient(x-R*0.35,y-R*0.4,R*0.1,x,y,R*1.02);
  g.addColorStop(0,col[0]); g.addColorStop(1,col[1]);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,TAU); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,R,0,TAU); ctx.clip();
  drawPlanetTexture(ctx,b.kind,R,rot*0.4);
  ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(x,y,R,0,TAU); ctx.stroke();
  // 大气光晕（有大气/冰巨星的柔和辉光）
  if(b.kind==='earth'||b.kind==='venus'||b.kind==='uranus'||b.kind==='neptune'||b.kind==='titan'){
    const at=ctx.createRadialGradient(x,y,R*0.92,x,y,R*1.28);
    at.addColorStop(0,'rgba(150,220,255,0.28)');
    at.addColorStop(1,'rgba(150,220,255,0)');

  }

    ctx.beginPath(); ctx.ellipse(x,y,R*1.9,R*0.5,-0.35,0,TAU); ctx.stroke();

    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=3;
    ctx.strokeText(b.name,x,y+R+16*sc); ctx.fillStyle='#fff'; ctx.fillText(b.name,x,y+R+16*sc);

function exDrawStar(st,t){
  const pr=exProject(st); if(!pr) return;
  const sc=pr.scale;
  if(sc<0.01) return;
  const x=pr.x, y=pr.y;
  const tw=0.6+0.4*Math.sin(t*3+st.t*7);
  ctx.save(); ctx.translate(x,y); ctx.rotate(st.t*0.3);
  const s=Math.max(2,5*sc*tw);
  ctx.fillStyle='#ffe9a8';
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5, r=i%2===0?s:s*0.4;
    ctx[i===0?'moveTo':'lineTo'](Math.cos(a)*r,Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,233,168,0.4)';
  ctx.beginPath(); ctx.arc(0,0,s*1.7,0,TAU); ctx.fill();
  ctx.restore();
}
function exDrawAsteroid(a,t){
  const pr=exProject(a); if(!pr) return;
  const sc=pr.scale, R=a.r*sc;
  if(R<0.5) return;
  const x=pr.x, y=pr.y;
  ctx.save(); ctx.translate(x,y); ctx.rotate(a.t*0.4);
  const g=ctx.createRadialGradient(-R*0.3,-R*0.3,R*0.1,0,0,R);
  g.addColorStop(0,'#b0a894'); g.addColorStop(1,'#5c5548');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-R,0); ctx.lineTo(-R*0.5,-R*0.8); ctx.lineTo(R*0.3,-R*0.7);
  ctx.lineTo(R,R*0.2); ctx.lineTo(R*0.4,R*0.8); ctx.lineTo(-R*0.7,R*0.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='rgba(40,36,28,0.5)';

}
function exDrawShip(t){
  const pr=exProject(EX.ship); if(!pr) return;

  const f=exCamDir();
  const p2=exProject({x:s.x+f.x*14,y:s.y+f.y*14,z:s.z+f.z*14});
  if(p2) ang=Math.atan2(p2.y-y,p2.x-x);
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  const R=Math.max(6,12*sc);
  const flick=0.7+0.3*Math.sin(t*40);
  ctx.fillStyle='rgba(255,180,60,'+(0.7+0.3*flick)+')';

  ctx.moveTo(-R*0.6,-R*0.2); ctx.lineTo(-R*(0.9+0.25*flick),0); ctx.lineTo(-R*0.6,R*0.2);
  ctx.closePath(); ctx.fill();
  const g=ctx.createLinearGradient(-R*0.5,0,R*0.5,0);
  g.addColorStop(0,'#e8eef5'); g.addColorStop(1,'#9fb4c8');
  ctx.fillStyle=g;
  rr(ctx,-R*0.7,-R*0.45,R*1.4,R*0.9,R*0.4); ctx.fill();
  ctx.fillStyle='#ff8a3a';
  ctx.beginPath(); ctx.moveTo(R*0.7,-R*0.42); ctx.lineTo(R*1.25,0); ctx.lineTo(R*0.7,R*0.42); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e05a3a';
  ctx.beginPath(); ctx.moveTo(-R*0.2,-R*0.4); ctx.lineTo(-R*0.9,-R*0.9); ctx.lineTo(-R*0.55,-R*0.35); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-R*0.2,R*0.4); ctx.lineTo(-R*0.9,R*0.9); ctx.lineTo(-R*0.55,R*0.35); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#aee8ff'; ctx.strokeStyle='#3a5a7a'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(R*0.2,0,R*0.28,0,TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.85)';

// 探索模式输入：左摇杆/WASD 移动 · 按住任意处拖动转视角 · 滚轮缩放
function exCamDir(){
  return {x:Math.cos(EX.cam.pitch)*Math.sin(EX.cam.yaw),
          y:Math.sin(EX.cam.pitch),
          z:Math.cos(EX.cam.pitch)*Math.cos(EX.cam.yaw)};
}
function exPointerMove(mx,my,id){
  G.mouse.x=mx; G.mouse.y=my;
  if(EX.joyMove && EX.joyMove.id===id){ EX.joyMove.x=mx; EX.joyMove.y=my; }
  if(EX.look && EX.look.id===id){
    const dx=mx-EX.look.lx, dy=my-EX.look.ly;
    EX.look.lx=mx; EX.look.ly=my;
    EX.cam.yaw-=dx*0.0055;
    EX.cam.pitch=clamp(EX.cam.pitch-dy*0.0055,-1.5,1.5);
  }
  // 拖动超过阈值则视为拖动（点击行星开商店的意图取消）
  if(EX.tapPlanet && EX.tapPlanet.id===id && !EX.tapPlanet.moved &&
     Math.hypot(mx-EX.tapPlanet.px,my-EX.tapPlanet.py)>7) EX.tapPlanet.moved=true;
}
function exHandleDown(mx,my,id,pointerType){
  if(EX.state==='win'){
    if(mx>W/2-110&&mx<W/2+110&&my>332&&my<388){ setHint(HINT_BATTLE); G.state='select'; S.select(); }
    return;
  }
  if(EX.state==='dock'){
    const pw=440, ph=270, x=W/2-pw/2, y=H/2-ph/2;
    const items=[{cost:20,fn:()=>{EX.accel=5; S.boost();}},{cost:15,fn:()=>{EX.shield=8; S.buy();}}];
    const iw=180, ih=110, iy=y+92;
    for(let i=0;i<2;i++){
      const ix=x+20+i*(iw+20);
      if(mx>ix&&mx<ix+iw&&my>iy&&my<iy+ih){
        const it=items[i];
        if(EX.stardust>=it.cost){ EX.stardust-=it.cost; it.fn(); S.select(); exFloat(EX.ship.x,EX.ship.y,EX.ship.z,'已购买！','#9fd8ff'); }
        else S.invalid();
        return;
      }
    }
    if(mx>W/2-60&&mx<W/2+60&&my>y+ph-58&&my<y+ph-22){ EX.dockBlock=EX.docked?EX.docked.id:null; EX.docked=null; EX.state='fly'; EX.cool=1.5; S.select(); }
    return;
  }
  if(my<60 && mx>W-84 && mx<W-12){ setHint(HINT_BATTLE); G.state='select'; S.select(); return; }
  if(EX.state!=='fly') return;
  // 记录可能点按到的行星（点击才开商店，拖动视为转视角/移动，不弹商店）
  if(EX.basis){
    let best=null, bestD=1e9;
    for(const pb of EX_BODIES){
      if(!EX.discovered[pb.id]) continue;
      const pr=exProject(pb);
      const d=pr?Math.hypot(mx-pr.x,my-pr.y):1e9;
      const th=Math.max(20,pb.r*(pr?pr.scale:1)*1.6);
      if(pr && d<th && d<bestD){ best=pb; bestD=d; }
    }
    if(best) EX.tapPlanet={id, body:best, px:mx, py:my, moved:false};
  }
  // 触摸：左半屏=移动摇杆，右半屏=拖动转视角；鼠标：点到摇杆底座=移动，其余拖动=转视角
  if(pointerType==='touch'){
    if(mx<W/2){
      if(!EX.joyMove) EX.joyMove={id, x:mx, y:my};
    }else if(!EX.look){
      EX.look={id, lx:mx, ly:my};
    }
  }else{
    if(Math.hypot(mx-JOY_MOVE.x,my-JOY_MOVE.y)<56 && !EX.joyMove){
      EX.joyMove={id, x:mx, y:my};
    }else if(!EX.look){
      EX.look={id, lx:mx, ly:my};
    }
  }
}
function exPointerUp(id){
  if(EX.tapPlanet && EX.tapPlanet.id===id){
    if(!EX.tapPlanet.moved){ EX.docked=EX.tapPlanet.body; EX.state='dock'; S.select(); }
    EX.tapPlanet=null;
  }
  if(EX.joyMove && EX.joyMove.id===id) EX.joyMove=null;
  if(EX.look && EX.look.id===id) EX.look=null;
}
function exPointerCancel(id){
  if(EX.tapPlanet && EX.tapPlanet.id===id) EX.tapPlanet=null;
  if(EX.joyMove && EX.joyMove.id===id) EX.joyMove=null;
  if(EX.look && EX.look.id===id) EX.look=null;
}

// ---------- 主循环 ----------
function update(dt){
  G.time+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);
  // 浮动文字/粒子 始终更新
  for(const f of G.floats){ f.life-=dt; }
  G.floats=G.floats.filter(f=>f.life>0);
  for(const p of G.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=240*dt; p.life-=dt; }
  G.particles=G.particles.filter(p=>p.life>0);
  if(G.state==='explore'){ exUpdate(dt); return; }
  if(G.state==='eat'){ eatUpdate(dt); return; }
  if(G.state==='intro'){
    G.introT+=dt;
    if(G.introT>1.2){ G.state='playing'; G.waveDelay=6; }
    updateSuns(dt);
    return;
  }
  if(G.state==='playing'){
    if(G.paused) return;
    // 冷却
    for(const k in G.seedCd) if(G.seedCd[k]>0) G.seedCd[k]-=dt;
    updateSuns(dt);
    updatePlants(dt);
    updateProjectiles(dt);
    updateZombies(dt);
    updateWaves(dt);
    checkWin();
    // 植物受击闪烁
    for(const p of G.plants){ if(p.hitFlash>0)p.hitFlash-=dt; }
    // 僵尸旗帜
    for(const z of G.zombies){ if(z.flagRaise<1) z.flagRaise+=dt*1.5; }
  }
  if(G.state==='win'||G.state==='lose'){
    updateSuns(dt);
    for(const z of G.zombies){ if(z.dying){z.deathT+=dt;} }
    G.zombies=G.zombies.filter(z=>z.deathT<1.15);
  }
}
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  update(dt);
  ctx.save();
  if(G.shake>0) ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
  render(now/1000);
  ctx.restore();
  requestAnimationFrame(loop);
}

// ---------- 输入（Pointer Events 统一鼠标/触控） ----------
function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
function updateHover(mx,my){
  G.mouse.x=mx; G.mouse.y=my;
  if(mx>LAWN_X&&mx<LAWN_X+GRID_W&&my>LAWN_Y&&my<LAWN_Y+GRID_H){
    const cc=cellCenter(colOf(mx),rowOf(my));
    G.hoverCell={x:cc.x,y:cc.y,col:colOf(mx),row:rowOf(my)};
  }else G.hoverCell=null;
}
canvas.addEventListener('pointermove',e=>{
  const p=pointerPos(e);
  if(G.state==='explore') exPointerMove(p.x,p.y,e.pointerId);
  else if(G.state==='eat') eatPointerMove(p.x,p.y,e.pointerId);
  else updateHover(p.x,p.y);
});
canvas.addEventListener('pointerup',e=>{
  if(G.state==='explore') exPointerUp(e.pointerId);
  else if(G.state==='eat') eatPointerUp(e.pointerId,p=>pointerPos(e));
});
canvas.addEventListener('pointercancel',e=>{
  if(G.state==='explore') exPointerCancel(e.pointerId);
  else if(G.state==='eat') eatPointerUp(e.pointerId);
});
canvas.addEventListener('wheel',e=>{
  if(G.state==='explore'){ e.preventDefault(); EX.cam.focal=clamp(EX.cam.focal*Math.exp(e.deltaY*0.0012),250,950); }
},{passive:false});
canvas.addEventListener('pointerdown',e=>{
  // 鼠标右键 = 取消选择；触摸不区分按键
  if(e.pointerType==='mouse'&&e.button===2){ G.selected=null; return; }
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  const p=pointerPos(e);
  if(G.state==='explore'){ exHandleDown(p.x,p.y,e.pointerId,e.pointerType); return; }
  if(G.state==='eat'){ eatPointerDown(p.x,p.y,e.pointerId); return; }
  updateHover(p.x,p.y);
  handleClick(p.x,p.y);
});
canvas.addEventListener('contextmenu',e=>{e.preventDefault(); G.selected=null;});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); if(G.state==='playing') G.paused=!G.paused; }
  const map={'Digit1':'puff','Digit2':'glow','Digit3':'reishi','Digit4':'agaric','Digit5':'truffle'};
  if(map[e.code]&&(G.state==='playing'||G.state==='intro')){
    G.selected=G.selected===map[e.code]?null:map[e.code]; S.select();
  }
  if(G.state==='explore'){
    const k=EX.keys;
    if(e.code==='KeyW'||e.code==='ArrowUp') k.up=true;
    if(e.code==='KeyS'||e.code==='ArrowDown') k.down=true;
    if(e.code==='KeyA'||e.code==='ArrowLeft') k.left=true;
    if(e.code==='KeyD'||e.code==='ArrowRight') k.right=true;
  }
});
document.addEventListener('keyup',e=>{
  if(G.state==='explore'){
    const k=EX.keys;
    if(e.code==='KeyW'||e.code==='ArrowUp') k.up=false;
    if(e.code==='KeyS'||e.code==='ArrowDown') k.down=false;
    if(e.code==='KeyA'||e.code==='ArrowLeft') k.left=false;
    if(e.code==='KeyD'||e.code==='ArrowRight') k.right=false;
  }
});
function handleClick(mx,my){
  if(G.state==='explore'){ exHandleDown(mx,my); return; }
  if(G.state==='title'){
    if(mx>W/2-110&&mx<W/2+110&&my>420&&my<476){ G.state='select'; S.select(); }
    return;
  }
  if(G.state==='select'){
    const cw=148,gap=9,x0=13,y=200;
    for(let i=0;i<5;i++){
      const x=x0+i*(cw+gap);
      if(mx>x&&mx<x+cw&&my>y&&my<y+300){
        if(i<3) startLevel(i); else if(i===3) startExplore(); else startEat();
        S.select(); return;
      }
    }
    return;
  }
  if(G.state==='win'||G.state==='lose'){
    const win=G.state==='win'; const btnY=win?340:320;
    if(mx>W/2-250&&mx<W/2-30&&my>btnY&&my<btnY+56){ startLevel(G.lvlIdx); }
    else if(mx>W/2+30&&mx<W/2+250&&my>btnY&&my<btnY+56){
      if(win&&G.lvlIdx<LEVELS.length-1) startLevel(G.lvlIdx+1);
      else G.state='select';
    }
    return;
  }
  if(G.state==='playing'){
    if(G.paused){
      if(my<88&&mx>W-76&&mx<W-48){ /*暂停钮*/ G.paused=false; }
      else if(my<88&&mx>W-40&&mx<W-12){ soundOn=!soundOn; }
      else { G.paused=false; }
      return;
    }
    // HUD 按钮
    if(my<88){
      if(mx>W-76&&mx<W-48){ G.paused=true; return; }
      if(mx>W-40&&mx<W-12){ soundOn=!soundOn; return; }
    }
    // 阳光优先
    for(const s of G.suns){
      if(Math.hypot(mx-s.x,my-s.y)<34){ collectSun(s); return; }
    }
    // 种子卡
    if(my<88){
      const idx=Math.floor((mx-CARD_X0)/(CARD_W+CARD_GAP));
      if(idx>=0&&idx<Object.keys(SEEDS).length){
        const key=Object.keys(SEEDS)[idx];
        G.selected=G.selected===key?null:key;
        S.select();
      }
      return;
    }
    // 草坪种植
    if(G.hoverCell&&G.selected){
      plantSeed(G.hoverCell);
    }else if(G.hoverCell&&!G.selected){
      // 点击草坪无选择时无操作
    }
  }
}

// ---------- 启动 ----------
clearEntities();
G.state='select';
// 画面等比铺满窗口
function fitCanvas(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H);
  canvas.style.width=Math.floor(W*s)+'px';
  canvas.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',fitCanvas);
fitCanvas();
requestAnimationFrame(loop);
</script>
