<head>

<title>蘑菇大战僵尸 · Mushroom vs Zombies</title>
<style>
  html,body{margin:0;padding:0;background:#14141f;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

  #hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:10;color:#d8d8ea;font-size:12.5px;letter-spacing:.5px;text-align:center;
    pointer-events:none;background:rgba(10,12,20,0.55);padding:6px 16px;border-radius:999px;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hint b{color:#a9a9d8}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="800" height="640"></canvas>
<div id="hint">🖱️ 左键/触摸 选择并种植蘑菇 · 点击阳光收集 · 右键/点空白 取消选择 · <b>1-5</b> 快速选种 · <b>空格</b> 暂停 · <b>第4关</b>：拖住飞船飞行 / 拖空白旋转视角</div>
</div>
<script>
"use strict";
/* ============================================================
   蘑菇大战僵尸 · Mushroom vs Zombies
   像素级复刻植物大战僵尸核心玩法，植物全部替换为真实蘑菇物种
   第1关:白天草地  第2关:月光之夜
============================================================ */

// ---------- 基础配置 ----------
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=800, H=640;
const COLS=9, ROWS=5, CELL_W=80, CELL_H=100;
const LAWN_X=40, LAWN_Y=100;
const SPAWN_X=W+60;
const GRID_W=COLS*CELL_W, GRID_H=ROWS*CELL_H;

const TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rand(a,b){return a+Math.random()*(b-a);}
function irand(a,b){return Math.floor(rand(a,b+1));}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function cellCenter(col,row){return {x:LAWN_X+col*CELL_W+CELL_W/2, y:LAWN_Y+row*CELL_H+CELL_H/2};}
function colOf(x){return clamp(Math.floor((x-LAWN_X)/CELL_W),0,COLS-1);}
function rowOf(y){return clamp(Math.floor((y-LAWN_Y)/CELL_H),0,ROWS-1);}

// ---------- 音频（WebAudio 合成） ----------
let AC=null, soundOn=true;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,type,v,slide,delay){
  if(!soundOn)return; try{
    const a=ac(); if(!a)return; const t0=a.currentTime+(delay||0);
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
    g.gain.setValueAtTime(v||0.15,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+d);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+0.02);
  }catch(e){}
}
function noise(d,v,f,delay){
  if(!soundOn)return; try{
    const a=ac(); if(!a)return; const t0=a.currentTime+(delay||0);
    const n=a.sampleRate*d, b=a.createBuffer(1,n,a.sampleRate), dt=b.getChannelData(0);
    for(let i=0;i<n;i++) dt[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(); s.buffer=b;
    const flt=a.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=f||900;
    const g=a.createGain(); g.gain.setValueAtTime(v||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+d);
    s.connect(flt); flt.connect(g); g.connect(a.destination); s.start(t0);
  }catch(e){}
}
const S={
  plant:()=>{tone(160,0.18,'triangle',0.25,60); noise(0.08,500,0.15);},
  shoot:()=>tone(540,0.06,'square',0.06),
  hit:()=>noise(0.05,1100,0.12),
  explode:()=>{noise(0.55,700,0.5); tone(90,0.5,'sawtooth',0.25,-50);},
  sun:()=>{tone(880,0.12,'sine',0.16); tone(1318,0.2,'sine',0.12,0,0.06);},
  eat:()=>{noise(0.09,420,0.18); tone(110,0.08,'square',0.08);},
  groan:()=>tone(85,0.6,'sawtooth',0.1,-35),
  select:()=>tone(320,0.05,'triangle',0.1),
  invalid:()=>tone(140,0.12,'square',0.1),
  mower:()=>{tone(240,0.4,'sawtooth',0.2,220); noise(0.4,1500,0.2);},
  die:()=>{noise(0.35,600,0.25); tone(300,0.4,'triangle',0.15,-250);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,0.28,'triangle',0.18,0,i*0.14));},
  lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,0.35,'sawtooth',0.12,-20,i*0.22));},
  collect:()=>tone(1200,0.07,'sine',0.1,-350),
  discover:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.22,'triangle',0.15,0,i*0.09));},
  buy:()=>{tone(660,0.09,'triangle',0.15); tone(990,0.13,'triangle',0.12,0,0.07);},
  boost:()=>tone(220,0.3,'sawtooth',0.12,420),
};

// ---------- 数据定义 ----------
const SEEDS={
  puff:   {name:'马勃菇',  cost:100, cd:6,  hp:300,  key:'1', kind:'shooter'},
  glow:   {name:'荧光菇',  cost:50,  cd:6,  hp:300,  key:'2', kind:'sun'    },
  reishi: {name:'灵芝',    cost:50,  cd:18, hp:4000, key:'3', kind:'wall'   },
  agaric: {name:'毒蝇伞',  cost:150, cd:28, hp:300,  key:'4', kind:'bomb',  arm:0.9, dmg:1800, radius:1 },
  truffle:{name:'松露',    cost:25,  cd:18, hp:300,  key:'5', kind:'mine',  arm:3,   dmg:1800, radius:0 },
};
const ZOMBIES={
  basic: {name:'普通僵尸', hp:200,  speed:26},
  cone:  {name:'路障僵尸', hp:570,  speed:26},
  bucket:{name:'铁桶僵尸', hp:1300, speed:20},
  flag:  {name:'旗帜僵尸', hp:200,  speed:26},
  mars:  {name:'火星',  hp:500,  speed:24},
  uranus:{name:'天王星',hp:1100, speed:14},
  sun:   {name:'太阳',  hp:2200, speed:10},
};
// 第3关·星空战场：太阳系星球敌军（关卡 theme==='space' 时套用，水星=basic位/金星=cone位/土星=flag位）
const SPACE_ENEMIES={
  basic: {name:'水星',  hp:160,  speed:30},
  cone:  {name:'金星',  hp:480,  speed:25},
  mars:  {name:'火星',  hp:500,  speed:24},
  bucket:{name:'木星',  hp:1300, speed:13},
  uranus:{name:'天王星',hp:1100, speed:14},
  flag:  {name:'土星',  hp:900,  speed:16},
  sun:   {name:'太阳',  hp:2200, speed:10},
};
const ZOMBIE_TYPES=['basic','cone','bucket','flag'];

const LEVELS=[
  {
    id:1, name:'第 1 关 · 白天草地', theme:'day', sunType:'sun', startSun:150, sunFall:9,
    waves:[
      [{z:'basic',n:2}],
      [{z:'basic',n:3}],
      [{z:'basic',n:2},{z:'cone',n:1}],
      [{z:'basic',n:2},{z:'cone',n:2}],
      [{z:'basic',n:3},{z:'cone',n:1},{z:'flag',n:1}],
      [{z:'basic',n:2},{z:'cone',n:1},{z:'bucket',n:1}],
      [{z:'basic',n:2},{z:'cone',n:2},{z:'bucket',n:1}],
      [{z:'basic',n:2},{z:'cone',n:2},{z:'bucket',n:1}],
      [{z:'basic',n:2},{z:'cone',n:2},{z:'bucket',n:1}],
      [{z:'basic',n:3},{z:'cone',n:2},{z:'bucket',n:2},{z:'flag',n:1}],
    ],
  },
  {
    id:2, name:'第 2 关 · 月光之夜', theme:'night', sunType:'moon', startSun:100, sunFall:8,
    waves:[
      [{z:'basic',n:2}],
      [{z:'basic',n:3}],
      [{z:'basic',n:2},{z:'cone',n:1}],
      [{z:'basic',n:2},{z:'cone',n:2}],
      [{z:'basic',n:3},{z:'cone',n:2},{z:'flag',n:1}],
      [{z:'basic',n:2},{z:'cone',n:2},{z:'bucket',n:1}],
      [{z:'basic',n:2},{z:'cone',n:1},{z:'bucket',n:2}],
      [{z:'basic',n:3},{z:'cone',n:2},{z:'bucket',n:1}],
      [{z:'basic',n:2},{z:'cone',n:2},{z:'bucket',n:2}],
      [{z:'basic',n:3},{z:'cone',n:2},{z:'bucket',n:2},{z:'flag',n:1}],
      [{z:'basic',n:3},{z:'cone',n:2},{z:'bucket',n:2}],
      [{z:'basic',n:4},{z:'cone',n:3},{z:'bucket',n:3},{z:'flag',n:1}],
    ],
  },
  {
    id:3, name:'第 3 关 · 星空战场', theme:'space', sunType:'star', startSun:125, sunFall:7.5,
    waves:[
      [{z:'basic',n:2}],
      [{z:'basic',n:3}],
      [{z:'basic',n:2},{z:'cone',n:1}],
      [{z:'basic',n:2},{z:'mars',n:2}],
      [{z:'basic',n:3},{z:'mars',n:1},{z:'flag',n:1}],
      [{z:'basic',n:2},{z:'mars',n:2},{z:'bucket',n:1}],
      [{z:'basic',n:2},{z:'mars',n:1},{z:'uranus',n:2}],
      [{z:'basic',n:3},{z:'cone',n:2},{z:'bucket',n:1}],
      [{z:'basic',n:2},{z:'mars',n:2},{z:'bucket',n:2}],
      [{z:'basic',n:3},{z:'uranus',n:2},{z:'bucket',n:1},{z:'flag',n:1}],
      [{z:'basic',n:3},{z:'mars',n:2},{z:'bucket',n:2},{z:'uranus',n:1}],
      [{z:'basic',n:4},{z:'mars',n:3},{z:'bucket',n:2},{z:'sun',n:1},{z:'flag',n:1}],
    ],
  },
];

// ---------- 游戏状态 ----------
const G={
  state:'title', // title | select | intro | playing | win | lose
  level:null, lvlIdx:0,
  sun:0, suns:[], sunTimer:0,
  plants:[], projectiles:[], zombies:[], mowers:[], particles:[], floats:[],
  seedCd:{puff:0,glow:0,reishi:0,agaric:0,truffle:0},
  selected:null, mouse:{x:0,y:0}, hoverCell:null,
  waveIndex:0, waveActive:false, waveDelay:0, waveTimer:0, pendingZombies:[],
  clearedWaves:0, allWavesDone:false,
  banner:null, introT:0, time:0, shake:0,
  kills:0, sunEarned:0, paused:false, last:performance.now(),
};
function newMowers(){
  G.mowers=[];
  for(let r=0;r<ROWS;r++) G.mowers.push({row:r, x:LAWN_X+6, state:'idle', t:rand(0,10)});
}
function clearEntities(){
  G.suns=[]; G.plants=[]; G.projectiles=[]; G.zombies=[]; G.particles=[]; G.floats=[];
  G.waveIndex=0; G.waveActive=false; G.waveDelay=6; G.waveTimer=0; G.pendingZombies=[];
  G.clearedWaves=0; G.allWavesDone=false; G.banner=null; G.time=0; G.kills=0; G.sunEarned=0;
  G.seedCd={puff:0,glow:0,reishi:0,agaric:0,truffle:0};
  newMowers();
}
function startLevel(idx){
  G.lvlIdx=idx; G.level=LEVELS[idx];
  G.sun=G.level.startSun; G.sunTimer=2; G.state='intro'; G.introT=0;
  G.selected=null; G.paused=false;
  clearEntities();
}
// 关卡流程：init 时 waveIndex=0, waveDelay 大一点等 intro 结束

// ---------- 粒子/浮动文字 ----------
function boom(x,y,color,big){
  const n=big?46:22;
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU, sp=rand(40,big?320:180);
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rand(0.3,big?0.9:0.5),
      max:1,size:rand(3,big?9:6),color:Math.random()<0.6?color:(Math.random()<0.5?'#ffd166':'#fff')});
  }
  if(big) G.shake=12;
}
function floatText(x,y,str,color){
  G.floats.push({x,y,str,color:color||'#ffe066',life:1});
}
function addSunCollectFx(x,y){
  for(let i=0;i<6;i++){
    const a=Math.random()*TAU, sp=rand(30,90);
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:0.4,max:0.4,size:rand(2,4),color:'#ffe066'});
  }
}

// ---------- 阳光系统 ----------
function spawnFallingSun(){
  const theme=G.level.theme;
  const x=rand(LAWN_X+30,LAWN_X+GRID_W-30);
  const row=irand(1,4);
  const targetY=LAWN_Y+row*CELL_H+CELL_H/2+rand(-14,14);
  const v=Math.random()<0.2?50:25;
  G.suns.push({x,y:-30,targetY,vy:rand(60,85),state:'fall',v,ttl:9,t:rand(0,10)});
}
function spawnMushroomSun(plant){
  // 峰值高度钳制在草坪内，避免飘到顶部蘑菇栏后面被遮挡
  const peak=Math.max(plant.y-rand(60,90), LAWN_Y+15);
  G.suns.push({x:plant.x,y:plant.y-40,targetY:peak,vy:-60,vx:rand(-8,8),state:'rise',v:25,ttl:9,t:rand(0,10)});
}
function collectSun(s){
  G.sun+=s.v; G.sunEarned+=s.v;
  addSunCollectFx(s.x,s.y);
  floatText(s.x,s.y-14,'+'+s.v);
  S.sun();
  s.dead=true;
}
function updateSuns(dt){
  G.sunTimer-=dt;
  if(G.sunTimer<=0 && G.state==='playing'){
    G.sunTimer=rand(G.level.sunFall*0.8,G.level.sunFall*1.25);
    spawnFallingSun();
  }
  for(const s of G.suns){
    s.t+=dt;
    if(s.state==='rise'){ s.y+=s.vy*dt; s.x+=s.vx*dt; if(s.y<=s.targetY){s.y=s.targetY;s.state='fall';s.vy=rand(60,80);} }
    else if(s.state==='fall'){ s.y+=s.vy*dt; if(s.y>=s.targetY){s.y=s.targetY;s.state='ground';} }
    else if(s.state==='ground'){ s.ttl-=dt; if(s.ttl<=0){ s.dead=true; if(s.ttl>-0.6&&Math.random()<0.5)G.particles.push({x:s.x,y:s.y,vx:0,vy:20,life:0.3,max:0.3,size:4,color:'#ffe066'});} }
  }
  G.suns=G.suns.filter(s=>!s.dead);
}

// ---------- 种植 ----------
function plantSeed(cell){
  const key=G.selected, sd=SEEDS[key];
  if(!sd) return;
  const col=(cell.col!==undefined)?cell.col:colOf(cell.x);
  const row=(cell.row!==undefined)?cell.row:rowOf(cell.y);
  if(G.sun<sd.cost){ S.invalid(); floatText(cell.x,cell.y-30,'阳光不足!','#ff8c8c'); return; }
  if(G.seedCd[key]>0) return;
  const occ=G.plants.find(p=>p.row===row&&p.col===col);
  const occZ=G.zombies.some(z=>z.row===row&&!z.dying&&z.x>cell.x-40&&z.x<cell.x+40);
  if(occ||occZ){ S.invalid(); return; }
  G.sun-=sd.cost;
  G.seedCd[key]=sd.cd;
  const p={key,row,col,x:cell.x,y:cell.y,hp:sd.hp,state:'idle',t:rand(0,5),
    fireT:0,emitT:2.5,armed:false,armT:0,explodeT:0,hitFlash:0};
  G.plants.push(p);
  G.selected=null; // 种完自动取消选中，避免连点误种
  S.plant();
  boom(cell.x,cell.y+10,'#c8e6a0',false);
}
// 更新植物
function updatePlants(dt){
  for(const p of G.plants){
    p.t+=dt; const sd=SEEDS[p.key];
    if(p.hp<=0){ p.dead=true; boom(p.x,p.y-10,'#b0a48a',false); continue; }
    if(sd.kind==='shooter'){
      p.fireT-=dt;
      if(p.fireT<=0){
        p.fireT=0.8;
        // 检查该行右侧是否有僵尸
        const hasTarget=G.zombies.some(z=>z.row===p.row&&z.x>p.x&&!z.dying);
        if(hasTarget){
          G.projectiles.push({x:p.x+26,y:p.y-14,row:p.row,vx:300});
          S.shoot();
        }
      }
    }
    if(sd.kind==='sun'){
      p.emitT-=dt;
      if(p.emitT<=0){ p.emitT=18; spawnMushroomSun(p); }
    }
    if(sd.kind==='bomb'||sd.kind==='mine'){
      if(!p.armed){
        p.armT+=dt;
        if(p.armT>=sd.arm) p.armed=true;
      }
      if(p.armed && p.explodeT===0){
        let trigger=false;
        if(sd.kind==='bomb'){
          trigger=G.zombies.some(z=>!z.dying&&Math.abs(z.row-p.row)<=sd.radius&&
            Math.abs(colOf(z.x)-p.col)<=sd.radius);
        }else{
          // 松露：以僵尸前缘触及/进入本格判定（与"停步啃食"阈值一致，覆盖啃食状态）
          const inCell=z=>!z.dying&&z.row===p.row&&(z.x-26)<=p.x+48&&(z.x+22)>=p.x-40;
          trigger=G.zombies.some(inCell);
        }
        if(trigger){ p.explodeT=0.42; S.explode(); }
      }
      if(p.explodeT>0){
        p.explodeT-=dt;
        if(p.explodeT<=0){
          let boomX=p.x,boomY=p.y-10;
          let targets;
          if(sd.kind==='bomb'){
            targets=G.zombies.filter(z=>!z.dying&&Math.abs(z.row-p.row)<=1&&Math.abs(colOf(z.x)-p.col)<=1);
          }else{
            const inCell=z=>!z.dying&&z.row===p.row&&(z.x-26)<=p.x+48&&(z.x+22)>=p.x-40;
            targets=G.zombies.filter(inCell);
          }
          for(const z of targets) killZombie(z,1800);
          boom(boomX,boomY,'#ff7b45',sd.kind==='bomb');
          p.dead=true;
        }
      }
    }
  }
  G.plants=G.plants.filter(p=>!p.dead);
}

// ---------- 弹道 ----------
function updateProjectiles(dt){
  for(const s of G.projectiles){
    s.x+=s.vx*dt;
    let dead=false;
    for(const z of G.zombies){
      if(z.row===s.row&&!z.dying&&s.x>=z.x-24&&s.x<=z.x+30){
        z.hp-=20; z.hitT=0.12; z.knock=5; // 强力击退（儿童友好玩法：堆射手可把僵尸一直推回去，永远能赢）
        S.hit();
        G.particles.push({x:s.x,y:s.y-8,vx:-20,vy:-10,life:0.25,max:0.25,size:3,color:'#8fd06a'});
        if(z.hp<=0) killZombie(z,0);
        dead=true; break;
      }
    }
    if(dead) s.dead=true;
    else if(s.x>W+40) s.dead=true;
  }
  G.projectiles=G.projectiles.filter(s=>!s.dead);
}
function killZombie(z,dmg){
  if(z.dying) return;
  z.hp-=dmg;
  if(z.hp<=0&&!z.dying){
    z.dying=true; z.deathT=0;
    G.kills++;
    if(dmg>100) S.die();
  }
}

// ---------- 僵尸 ----------
function spawnZombie(type){
  const themed=(G.level&&G.level.theme==='space'&&SPACE_ENEMIES[type])||null;
  const d=themed||ZOMBIES[type];
  const row=irand(0,ROWS-1);
  G.zombies.push({type,row,x:SPAWN_X+rand(-30,30),hp:d.hp,spd:d.speed*(0.92+Math.random()*0.16),
    state:'walk',t:rand(0,10),hitT:0,knock:0,dying:false,deathT:0,flagRaise:0,eatSnd:0,wave:0});
  if(themed){ tone(240,0.4,'sine',0.08,-180); } else { S.groan(); }
}
function updateZombies(dt){
  for(const z of G.zombies){
    z.t+=dt;
    if(z.hitT>0) z.hitT-=dt;
    if(z.knock>0){ z.x+=z.knock; z.knock*=0.85; }
    if(z.dying){
      z.deathT+=dt;
      if(z.deathT>1.15) z.dead=true;
      continue;
    }
    // 寻找要吃的最靠右的蘑菇
    let target=null;
    for(const p of G.plants){
      if(p.row===z.row && p.hp>0){
        if(!target||p.x>target.x) target=p;
      }
    }
    const front=z.x-26;
    if(target && front<=target.x+CELL_W/2+4){
      z.state='eat';
      target.hp-=100*dt;
      target.hitFlash=0.12;
      z.eatSnd-=dt;
      if(z.eatSnd<=0){
        z.eatSnd=0.28;
        S.eat();
        G.particles.push({x:target.x-10,y:target.y-14,vx:-rand(10,30),vy:-rand(10,30),life:0.3,max:0.3,size:3,color:'#c8a87a'});
      }
    }else{
      z.state='walk';
      z.x-=z.spd*dt;
    }
    // 触发铲草机 / 失败判定（僵尸前缘触及左边线）
    if(z.x-26<=LAWN_X+10){
      const m=G.mowers[z.row];
      if(m.state==='idle'){ m.state='active'; m.vx=340; S.mower(); }
      else if(m.state==='gone'){ loseGame(); }
    }
  }
  // 铲草机撞击
  for(const m of G.mowers){
    if(m.state==='active'){
      m.x+=m.vx*dt;
      for(const z of G.zombies){
        if(!z.dying&&z.row===m.row&&Math.abs(z.x-m.x)<34){ killZombie(z,99999); boom(z.x,z.y-20,'#ffb45c',false); }
      }
      if(m.x>W+80) m.state='gone';
    }
  }
  G.zombies=G.zombies.filter(z=>!z.dead);
}

// ---------- 波次系统 ----------
function startWave(){
  const w=G.level.waves[G.waveIndex];
  const isFlag=w.some(e=>e.z==='flag');
  const sp=G.level.theme==='space';
  const txt=isFlag?(sp?'🪐 一大波星球正在接近！':'🌊 一大波僵尸正在接近！')
    :(sp?'第 '+(G.waveIndex+1)+' 波星球来袭':'第 '+(G.waveIndex+1)+' 波僵尸来袭');
  G.banner={text:txt,t:2.2,big:isFlag};
  let delay=isFlag?3.5:2.2;
  G.pendingZombies=[];
  for(const e of w){
    for(let i=0;i<e.n;i++){
      G.pendingZombies.push({type:e.z,delay});
      delay+=rand(4,8);
    }
  }
  G.waveActive=true;
  G.waveTimer=0;
}
function updateWaves(dt){
  if(G.state!=='playing') return;
  if(G.banner){ G.banner.t-=dt; if(G.banner.t<=0) G.banner=null; }
  if(!G.waveActive && G.waveIndex<G.level.waves.length){
    G.waveDelay-=dt;
    if(G.waveDelay<=0) startWave();
    return;
  }
  if(G.waveActive){
    G.waveTimer+=dt;
    for(let i=G.pendingZombies.length-1;i>=0;i--){
      const e=G.pendingZombies[i];
      if(G.waveTimer>=e.delay){ spawnZombie(e.type); G.pendingZombies.splice(i,1); }
    }
    const alive=G.zombies.some(z=>!z.dying&&z.wave===G.waveIndex)||G.pendingZombies.length>0;
    if(!alive){
      // 波次结束
      G.clearedWaves=G.waveIndex+1;
      G.waveActive=false; G.waveIndex++;
      G.waveDelay=3.5;
      if(G.waveIndex>=G.level.waves.length) G.allWavesDone=true;
    }
  }
}
// 打上 wave 标记：spawnZombie 时记录当前波
const _origSpawn=spawnZombie;
spawnZombie=(type)=>{_origSpawn(type); const z=G.zombies[G.zombies.length-1]; z.wave=G.waveIndex; if(z.type==='flag') z.flagRaise=0;};

// ---------- 胜负 ----------
function loseGame(){
  if(G.state!=='playing') return;
  G.state='lose'; S.lose();
}
function checkWin(){
  if(G.state==='playing'&&G.allWavesDone&&G.zombies.length===0&&G.pendingZombies.length===0){
    G.state='win'; S.win();
  }
}

}

    c.strokeStyle='rgba(255,230,120,'+pulse+')'; c.lineWidth=2*s;
    c.beginPath(); c.ellipse(0,-2*s,17*s,13*s,0,0,TAU); c.stroke();
    c.fillStyle='rgba(255,230,120,'+(pulse+0.1)+')';
    c.font='bold '+(9*s)+'px sans-serif'; c.textAlign='center'; c.fillText('!',0,-12*s);
  }
  c.restore();
}

// ---------- 绘制：僵尸 ----------
function drawZombie(c,x,y,t,z){
  const s=1; // 僵尸不缩放
  const dying=z.dying;
  c.save(); c.translate(x,y);
  let rot=0,alpha=1;
  if(dying){
    const p=Math.min(1,z.deathT/0.55);
    rot=p*Math.PI*0.55;
    alpha=1-clamp((z.deathT-0.55)/0.5,0,1);
    c.globalAlpha=Math.max(0,alpha);
    c.rotate(rot);
  }
  const bob=dying?0:Math.sin(z.t*3.1)*2;
  const step=dying?0:Math.sin(z.t*4.5)*5;
  // 腿
  c.fillStyle='#4a3728';
  rr(c,-12,-44+step,11,26,4); c.fill();
  rr(c,3,-44-step,11,26,4); c.fill();
  // 鞋
  c.fillStyle='#242424';
  rr(c,-15,-26+step,15,8,3); c.fill();
  rr(c,1,-26-step,15,8,3); c.fill();
  // 躯干
  c.fillStyle='#5f7db8'; rr(c,-17,-84+bob,34,44,9); c.fill();
  c.fillStyle='#4d6491'; rr(c,-17,-84+bob,34,8,5); c.fill();
  // 领带
  c.fillStyle='#a83232'; c.beginPath(); c.moveTo(0,-72+bob); c.lineTo(8,-66+bob); c.lineTo(2,-56+bob); c.closePath(); c.fill();
  // 前伸手臂（向左）
  c.save(); c.translate(-16,-68+bob);
  c.rotate(0.45+Math.sin(z.t*3.2)*0.06);
  c.fillStyle='#5f7db8'; rr(c,-34,0,34,10,5); c.fill();
  c.restore();
  c.fillStyle='#8fbf6a'; c.beginPath(); c.arc(-49,-64+bob,6.5,0,TAU); c.fill();
  // 另一只手
  c.fillStyle='#5f7db8'; rr(c,4,-76+bob,11,24,5); c.fill();
  c.fillStyle='#8fbf6a'; c.beginPath(); c.arc(9,-52+bob,6,0,TAU); c.fill();
  // 头
  const hb=dying?0:Math.sin(z.t*5.2)*1.6;
  const hy=-100+bob+hb;
  c.fillStyle='#8fbf6a'; c.beginPath(); c.arc(-5,hy,19,0,TAU); c.fill();
  c.fillStyle='#7aa855'; c.beginPath(); c.arc(-22,hy-2,4.5,0,TAU); c.fill();
  // 眼
  c.fillStyle='#fff'; c.beginPath(); c.ellipse(-13,hy-7,7,6.5,0,0,TAU); c.fill();
  c.fillStyle='#2c2c2c'; c.beginPath(); c.arc(-11,hy-7,2.8,0,TAU); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(-11.8,hy-8,1,0,TAU); c.fill();
  // 眉毛
  c.strokeStyle='#3a6b2e'; c.lineWidth=2.2;
  c.beginPath(); c.moveTo(-19,hy-15); c.lineTo(-7,hy-13); c.stroke();
  // 嘴
  c.strokeStyle='#4a3a1a'; c.lineWidth=1.6;
  c.beginPath(); c.moveTo(-13,hy+7); c.lineTo(-3,hy+10); c.stroke();
  // 缝线
  c.strokeStyle='#5a4a2a'; c.lineWidth=1;
  c.beginPath(); c.moveTo(-14,hy+6.4); c.lineTo(-13,hy+7.6); c.moveTo(-9,hy+8); c.lineTo(-8,hy+9.2); c.moveTo(-5,hy+9); c.lineTo(-4,hy+10.2); c.stroke();
  // 帽子/配件
  if(z.type==='cone'){
    c.fillStyle='#ff7b1f';
    c.beginPath(); c.moveTo(-18,hy-16); c.lineTo(-5,hy-38); c.lineTo(8,hy-16); c.closePath(); c.fill();
    c.strokeStyle='#c85a0e'; c.lineWidth=1.4; c.stroke();
    c.fillStyle='#ffb05c'; rr(c,-18,hy-21,26,6,2); c.fill();
  }
  if(z.type==='bucket'){
    c.fillStyle='#b8c0cc';
    rr(c,-20,hy-27,30,22,3); c.fill();
    rr(c,-22,hy-20,34,7,3); c.fill();
    c.fillStyle='#8a93a3'; rr(c,-20,hy-27,30,5,2); c.fill();
    c.strokeStyle='#6a7284'; c.lineWidth=1.2;
    c.beginPath(); c.moveTo(-14,hy-26); c.lineTo(-14,hy-6); c.moveTo(-6,hy-26); c.lineTo(-6,hy-6); c.stroke();
  }
  if(z.type==='flag'){
    const fr=Math.min(1,z.flagRaise||1);
    c.strokeStyle='#7a5a3a'; c.lineWidth=3;
    c.beginPath(); c.moveTo(14,hy+6); c.lineTo(14,hy-46*fr); c.stroke();
    if(fr>0.1){
      c.fillStyle='#c22b2b';
      c.beginPath();
      c.moveTo(14,hy-46*fr);
      c.lineTo(14+30*fr,hy-40*fr);
      c.lineTo(14,hy-33*fr);
      c.closePath(); c.fill();
      c.fillStyle='#fff';
      c.font='bold 8px sans-serif'; c.textAlign='center';
      c.fillText('☠',14+10*fr,hy-37*fr+2);
    }
  }
  // 受击闪烁
  if(z.hitT>0){
    c.globalAlpha=Math.min(alpha,0.55);
    c.fillStyle='#fff';
    c.beginPath(); c.arc(-5,hy,20,0,TAU); c.fill();
  }
  c.restore();
}

// ---------- 绘制：太阳系星球敌军 ----------
function planetMeta(type){
  if(type==='mercury') return {R:17, col:['#d6cbb8','#8a7f6e']};
  if(type==='venus')   return {R:20, col:['#f7e8ae','#c9a94e']};
  if(type==='mars')    return {R:20, col:['#ee8a62','#9c3d22']};
  if(type==='jupiter') return {R:30, col:['#ecc9a0','#b07844']};
  if(type==='uranus')  return {R:26, col:['#c8eee8','#5fa8c4']};
  if(type==='saturn')  return {R:23, col:['#f4e0b4','#c9a15e']};
  if(type==='sun')     return {R:32, col:['#ffd166','#ff7f1f']};
  return {R:20, col:['#dfe9ff','#9aa8c8']};
}
function drawPlanetTexture(c,type,R,roll){
  c.save();
  if(type==='mercury'){
    // 大量陨石坑（大小不一）+ 辐射纹
    c.fillStyle='rgba(110,96,80,0.7)';
    for(let i=0;i<11;i++){
      const a=i*1.9+roll*0.5, rr0=(Math.sin(i*2.3)*0.5+0.5)*R*0.68;
      const cr=R*(0.08+0.07*((i*7)%5)/5);
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,cr,0,TAU); c.fill();
    }
    // 辐射纹（亮色短线）
    c.strokeStyle='rgba(235,225,205,0.4)'; c.lineWidth=Math.max(1,R*0.03);
    for(let i=0;i<6;i++){
      const a=i*1.15+roll, rr0=(Math.sin(i*3.1)*0.5+0.5)*R*0.6;
      c.beginPath(); c.moveTo(Math.cos(a)*rr0,Math.sin(a)*rr0);
      c.lineTo(Math.cos(a)*(rr0+R*0.16),Math.sin(a)*(rr0+R*0.16)); c.stroke();
    }
    // 反光小坑
    c.fillStyle='rgba(240,232,214,0.5)';
    for(let i=0;i<5;i++){
      const a=i*2.6+roll, rr0=(Math.sin(i*1.7)*0.5+0.5)*R*0.7;
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,R*0.045,0,TAU); c.fill();
    }
  }else if(type==='venus'){
    // 多层漩涡云带（浓密大气）
    for(let i=0;i<5;i++){
      const yy=-R*0.75+i*R*0.4+(Math.sin(roll*1.3+i)*R*0.12);
      c.strokeStyle='rgba(190,140,50,'+(0.5+0.2*Math.sin(i*2.1))+')'; c.lineWidth=Math.max(2,R*0.12);
      c.beginPath(); c.moveTo(-R,yy); c.quadraticCurveTo(0,yy+R*0.35*Math.sin(roll+i),R,yy); c.stroke();
    }
    c.strokeStyle='rgba(255,242,200,0.55)'; c.lineWidth=Math.max(1.5,R*0.05);
    for(let i=0;i<4;i++){
      const yy=-R*0.7+i*R*0.42+(Math.cos(roll*1.1+i*2)*R*0.1);
      c.beginPath(); c.moveTo(-R,yy); c.quadraticCurveTo(0,yy-R*0.28*Math.cos(roll+i),R,yy); c.stroke();
    }
    // 极地涡旋
    c.fillStyle='rgba(255,240,190,0.5)';
    c.beginPath(); c.ellipse(0,-R*0.88,R*0.42,R*0.12,0,0,TAU); c.fill();
    c.beginPath(); c.ellipse(0,R*0.88,R*0.45,R*0.12,0,0,TAU); c.fill();
  }else if(type==='mars'){
    // 暗色火山区 + 深谷（水手峡谷）+ 极冠 + 尘暴
    c.fillStyle='rgba(110,45,22,0.7)';
    c.beginPath(); c.ellipse(-R*0.28+roll*2,R*0.18,R*0.28,R*0.2,0,0,TAU); c.fill();
    c.beginPath(); c.ellipse(R*0.32-roll*2,-R*0.26,R*0.22,R*0.16,0,0,TAU); c.fill();
    c.beginPath(); c.ellipse(-R*0.4,-R*0.05,R*0.14,R*0.1,0,0,TAU); c.fill();
    // 水手峡谷（一条斜向深谷）
    c.strokeStyle='rgba(70,30,15,0.65)'; c.lineWidth=Math.max(2,R*0.08);
    c.beginPath(); c.moveTo(-R*0.5,R*0.3); c.quadraticCurveTo(-R*0.1,R*0.5,R*0.42,R*0.12); c.stroke();
    c.strokeStyle='rgba(160,90,50,0.4)'; c.lineWidth=Math.max(1,R*0.03);
    c.beginPath(); c.moveTo(-R*0.5,R*0.3); c.quadraticCurveTo(-R*0.1,R*0.5,R*0.42,R*0.12); c.stroke();
    // 白色极冠
    c.fillStyle='rgba(255,245,235,0.95)';
    c.beginPath(); c.ellipse(-R*0.32,-R*0.62,R*0.34,R*0.15,-0.2,0,TAU); c.fill();
    c.beginPath(); c.ellipse(R*0.3,R*0.66,R*0.26,R*0.11,0.2,0,TAU); c.fill();
  }else if(type==='jupiter'){
    // 丰富横向云带（多色）+ 大红斑 + 白色卵形风暴
    const bands=[['rgba(205,150,90,0.7)',0.2],['rgba(150,95,55,0.55)',0.12],['rgba(230,195,140,0.65)',0.16],['rgba(165,110,65,0.6)',0.14],['rgba(120,80,50,0.5)',0.12],['rgba(215,170,115,0.7)',0.18],['rgba(160,105,60,0.55)',0.13]];
    for(let i=0;i<bands.length;i++){
      const y=-R*0.88+i*R*0.29+(Math.sin(roll*0.8+i)*R*0.02);
      c.fillStyle=bands[i][0];
      c.fillRect(-R,y,R*2,Math.max(3,R*bands[i][1]));
    }
    // 湍流边缘
    c.fillStyle='rgba(255,230,190,0.25)';
    for(let i=0;i<14;i++){
      const y=-R*0.85+i*R*0.13;
      c.fillRect(-R,y,R*2,Math.max(1.5,R*0.02));
    }
    // 大红斑
    c.fillStyle='rgba(215,80,50,0.95)';
    c.beginPath(); c.ellipse(roll%R-R*0.22,R*0.1,R*0.3,R*0.19,-0.3,0,TAU); c.fill();
    c.fillStyle='rgba(255,170,120,0.6)';
    c.beginPath(); c.ellipse(roll%R-R*0.22,R*0.1,R*0.2,R*0.11,-0.3,0,TAU); c.fill();
    // 白色卵形风暴
    c.fillStyle='rgba(255,250,235,0.75)';
    for(let i=0;i<3;i++){
      c.beginPath(); c.ellipse(R*0.1+i*0.22-roll%0.4, -R*0.3+i*0.3, R*0.09, R*0.06, 0, 0, TAU); c.fill();
    }
  }else if(type==='saturn'){
    // 柔和金带 + 环影
    c.fillStyle='rgba(215,175,110,0.55)';
    for(let i=0;i<6;i++){
      const y=-R*0.85+i*R*0.33+(Math.sin(roll+i)*3);
      c.fillRect(-R,y,R*2,Math.max(3,R*0.13));
    }
    c.fillStyle='rgba(180,140,85,0.4)';
    for(let i=0;i<6;i++){
      const y=-R*0.8+i*R*0.3;
      c.fillRect(-R,y,R*2,Math.max(1.5,R*0.05));
    }
    // 环投下的阴影（中纬度带）
    c.fillStyle='rgba(60,40,20,0.5)';
    c.fillRect(-R,R*0.22,R*2,Math.max(2,R*0.14));
  }else if(type==='uranus'){
    // 淡青竖带 + 横向薄雾 + 亮极区
    c.fillStyle='rgba(80,180,220,0.6)';
    for(let i=0;i<6;i++){
      const x=-R+i*R*0.36;
      c.fillRect(x,-R,Math.max(4,R*0.14),R*2);
    }
    c.fillStyle='rgba(200,245,255,0.3)';
    for(let i=0;i<5;i++){
      const y=-R*0.8+i*R*0.42+(Math.sin(roll*0.6+i)*5);
      c.fillRect(-R,y,R*2,Math.max(1.5,R*0.05));
    }
    c.fillStyle='rgba(230,250,255,0.55)';
    c.beginPath(); c.ellipse(0,-R*0.9,R*0.55,R*0.14,0,0,TAU); c.fill();
  }else if(type==='sun'){
    // 多处黑子 + 米粒组织（亮粒）
    c.fillStyle='rgba(200,85,20,0.75)';
    c.beginPath(); c.arc(-R*0.2+roll*3,R*0.08,R*0.16,0,TAU); c.fill();
    c.fillStyle='rgba(255,150,60,0.7)';
    c.beginPath(); c.arc(-R*0.2+roll*3,R*0.08,R*0.08,0,TAU); c.fill();
    c.fillStyle='rgba(210,90,25,0.65)';
    c.beginPath(); c.arc(R*0.24-roll*2,-R*0.24,R*0.11,0,TAU); c.fill();
    c.beginPath(); c.arc(-R*0.5+roll*4,R*0.42,R*0.07,0,TAU); c.fill();
    // 米粒组织颗粒
    c.fillStyle='rgba(255,230,150,0.28)';
    for(let i=0;i<22;i++){
      const a=i*2.7+roll, rr0=(Math.sin(i*1.9)*0.5+0.5)*R*0.85;
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,Math.max(1,R*0.02),0,TAU); c.fill();
    }
  }else if(type==='earth'){
    // 大陆（绿+棕）+ 海洋明暗 + 云带 + 极冠
    c.fillStyle='rgba(60,150,70,0.9)';
    c.beginPath(); c.ellipse(-R*0.2+roll*2,R*0.16,R*0.34,R*0.23,0.3,0,TAU); c.fill();
    c.beginPath(); c.ellipse(R*0.26-roll*2,-R*0.26,R*0.25,R*0.17,-0.4,0,TAU); c.fill();
    c.fillStyle='rgba(140,120,70,0.8)';
    c.beginPath(); c.ellipse(-R*0.34,-R*0.3,R*0.13,R*0.09,0,0,TAU); c.fill();
    c.beginPath(); c.ellipse(R*0.05+roll,R*0.34,R*0.15,R*0.1,0,0,TAU); c.fill();
    // 海洋深色
    c.fillStyle='rgba(20,70,130,0.3)';
    c.beginPath(); c.ellipse(R*0.4,-R*0.05,R*0.28,R*0.2,0.5,0,TAU); c.fill();
    // 云带（多层）
    c.strokeStyle='rgba(255,255,255,0.75)'; c.lineWidth=Math.max(2,R*0.08);
    for(let i=0;i<4;i++){
      const yy=-R*0.7+i*R*0.48+(Math.sin(roll+i*2)*4);
      c.beginPath(); c.moveTo(-R,yy); c.quadraticCurveTo(0,yy+R*0.16*Math.sin(roll+i),R,yy); c.stroke();
    }
    c.fillStyle='rgba(255,255,255,0.85)';
    c.beginPath(); c.ellipse(0,-R*0.92,R*0.5,R*0.15,0,0,TAU); c.fill();
    c.beginPath(); c.ellipse(0,R*0.92,R*0.55,R*0.15,0,0,TAU); c.fill();
  }else if(type==='neptune'){
    // 深蓝云带 + 大暗斑 + 亮甲烷云
    c.fillStyle='rgba(50,110,200,0.55)';
    for(let i=0;i<6;i++){
      const y=-R*0.85+i*R*0.34;
      c.fillRect(-R,y,R*2,Math.max(3,R*0.1));
    }
    c.fillStyle='rgba(20,60,140,0.7)';
    c.beginPath(); c.ellipse(roll%R-R*0.18,R*0.16,R*0.2,R*0.13,-0.3,0,TAU); c.fill();
    c.fillStyle='rgba(200,240,255,0.7)';
    c.beginPath(); c.ellipse(roll%R+R*0.1,-R*0.3,R*0.16,R*0.1,-0.2,0,TAU); c.fill();
    c.beginPath(); c.ellipse(-R*0.3,R*0.4,R*0.1,R*0.06,0,0,TAU); c.fill();
    // 亮带
    c.fillStyle='rgba(140,190,250,0.35)';
    for(let i=0;i<4;i++){ const y=-R*0.7+i*R*0.5; c.fillRect(-R,y,R*2,Math.max(1.5,R*0.04)); }
  }else if(type==='pluto'){
    // 冥王之心（斯普特尼克冰原）+ 暗斑 + 陨石坑 + 亮斑
    c.fillStyle='rgba(255,240,215,0.9)';
    c.beginPath(); c.ellipse(-R*0.12+roll*1.5,R*0.12,R*0.3,R*0.24,0,0,TAU); c.fill();
    c.fillStyle='rgba(120,90,60,0.6)';
    c.beginPath(); c.arc(R*0.22,R*0.38,R*0.16,0,TAU); c.fill();
    c.beginPath(); c.arc(-R*0.28,-R*0.42,R*0.11,0,TAU); c.fill();
    c.beginPath(); c.arc(R*0.05,-R*0.1,R*0.09,0,TAU); c.fill();
    // 环形山
    c.fillStyle='rgba(200,175,140,0.5)';
    c.beginPath(); c.arc(R*0.38,-R*0.15,R*0.07,0,TAU); c.fill();
    c.beginPath(); c.arc(-R*0.4,R*0.3,R*0.06,0,TAU); c.fill();
  }else if(type==='moon'){
    // 灰色陨石坑（带辐射纹）
    for(let i=0;i<9;i++){
      const a=i*1.25+roll*0.4, rr0=(Math.sin(i*2.7)*0.5+0.5)*R*0.64;
      const cr=R*(0.06+0.08*((i*5)%4)/4);
      c.fillStyle='rgba(120,120,128,0.65)';
      c.beginPath(); c.arc(Math.cos(a)*rr0,Math.sin(a)*rr0,cr,0,TAU); c.fill();
      c.fillStyle='rgba(235,235,240,0.5)';
      c.beginPath(); c.arc(Math.cos(a)*rr0-1,Math.sin(a)*rr0-1,cr*0.45,0,TAU); c.fill();
    }
    c.strokeStyle='rgba(225,225,230,0.35)'; c.lineWidth=Math.max(1,R*0.02);
    for(let i=0;i<4;i++){
      const a=i*1.7+roll, rr0=(Math.sin(i*3.3)*0.5+0.5)*R*0.6;
      c.beginPath(); c.moveTo(Math.cos(a)*rr0,Math.sin(a)*rr0);
      c.lineTo(Math.cos(a)*(rr0+R*0.12),Math.sin(a)*(rr0+R*0.12)); c.stroke();
    }
  }
  c.restore();
}
function drawPlanet(c,x,y,t,z){
  const dying=z.dying;
  const meta=planetMeta(z.type);
  const R=meta.R, col=meta.col;
  c.save(); c.translate(x,y);
  let alpha=1,scale=1;
  if(dying){ const p=clamp(z.deathT/0.9,0,1); alpha=1-p; scale=1-0.45*p; c.globalAlpha=Math.max(0,alpha); }
  const eating=z.state==='eat';
  const bob=dying?0:Math.sin(z.t*3.2)*3;
  const bounce=eating?Math.abs(Math.sin(z.t*8))*5:0;
  const tilt=dying?0:Math.sin(z.t*1.3)*0.05;
  // 阴影（贴地，在球体下方，随行居中）
  c.fillStyle='rgba(0,0,0,0.28)';
  c.beginPath(); c.ellipse(0,R+8,R*1.05,5,0,0,TAU); c.fill();
  c.translate(0,-bob-bounce);
  c.rotate(tilt);
  const roll=z.t*0.6;
  // 太阳光晕
  if(z.type==='sun'){
    const pulse=0.3+0.15*Math.sin(z.t*6);
    const sg=c.createRadialGradient(0,0,R*0.6,0,0,R*2.3);
    sg.addColorStop(0,'rgba(255,200,90,'+(0.5+pulse)+')'); sg.addColorStop(1,'rgba(255,200,90,0)');
    c.fillStyle=sg; c.fillRect(-R*2.4,-R*2.4,R*4.8,R*4.8);
  }
  // 土星环（画在球后面，球体遮挡背面，更立体；双环+卡西尼环缝）
  if(z.type==='saturn'){
    c.strokeStyle='rgba(238,205,150,0.95)'; c.lineWidth=6;
    c.beginPath(); c.ellipse(0,0,R*2.0,R*0.58,-0.32,0,TAU); c.stroke();
    c.strokeStyle='rgba(255,246,214,0.9)'; c.lineWidth=3.2;
    c.beginPath(); c.ellipse(0,0,R*1.62,R*0.47,-0.32,0,TAU); c.stroke();
    c.strokeStyle='rgba(120,80,40,0.55)'; c.lineWidth=1.4;
    c.beginPath(); c.ellipse(0,0,R*1.82,R*0.53,-0.32,0,TAU); c.stroke();
  }
  // 星体
  const g=c.createRadialGradient(-R*0.3,-R*0.4,R*0.15,0,0,R*1.05);
  g.addColorStop(0,col[0]); g.addColorStop(1,col[1]);
  c.fillStyle=g;
  c.beginPath(); c.arc(0,0,R*scale,0,TAU); c.fill();
  c.strokeStyle='rgba(0,0,0,0.35)'; c.lineWidth=1.5; c.stroke();
  // 纹理（裁剪在球内）
  c.save(); c.beginPath(); c.arc(0,0,R*scale,0,TAU); c.clip();
  drawPlanetTexture(c,z.type,R*scale,roll);
  c.restore();
  // 太阳光芒射线（旋转闪烁）
  if(z.type==='sun'){
    c.save(); c.rotate(z.t*0.4);
    c.strokeStyle='rgba(255,210,110,0.8)'; c.lineWidth=4;
    for(let i=0;i<12;i++){
      const a=i*TAU/12;
      c.beginPath();
      c.moveTo(Math.cos(a)*(R+4),Math.sin(a)*(R+4));
      c.lineTo(Math.cos(a)*(R+10),Math.sin(a)*(R+10));
      c.stroke();
    }
    c.restore();
  }
  // 脸（保持正向，可爱/坚定）
  c.save(); c.rotate(-tilt);
  const fR=R*0.34;
  const eyeY=-R*0.15;
  c.fillStyle='#fff';
  c.beginPath(); c.ellipse(-R*0.38,eyeY,fR,fR*1.1,0,0,TAU); c.fill();
  c.beginPath(); c.ellipse(R*0.38,eyeY,fR,fR*1.1,0,0,TAU); c.fill();
  c.fillStyle='#241a10';
  c.beginPath(); c.arc(-R*0.38+ (dying?0:Math.sin(z.t*4)*0.5),eyeY,fR*0.45,0,TAU); c.fill();
  c.beginPath(); c.arc(R*0.38+ (dying?0:Math.cos(z.t*4)*0.5),eyeY,fR*0.45,0,TAU); c.fill();
  // 嘴：吃食时张开
  if(eating){
    c.fillStyle='#5a2c10';
    c.beginPath(); c.ellipse(0,R*0.28,fR*0.6,fR*0.8,0,0,TAU); c.fill();
  }else{
    c.strokeStyle='#241a10'; c.lineWidth=2;
    c.beginPath(); c.arc(0,R*0.3,fR*0.55,0.15*Math.PI,0.85*Math.PI); c.stroke();
  }
  c.restore();
  // 受击白闪
  if(z.hitT>0){
    c.globalAlpha=Math.min(alpha,0.5);
    c.fillStyle='#fff';
    c.beginPath(); c.arc(0,0,R+1,0,TAU); c.fill();
  }
  c.restore();
}

// ---------- 绘制：阳光/月光/星光 ----------
function drawSunOrb(c,x,y,t,color,moon){
  const r=26;
  c.save(); c.translate(x,y);
  const pulse=1+0.07*Math.sin(t*3);
  const g=c.createRadialGradient(0,0,2,0,0,r*2.1);
  g.addColorStop(0,color); g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g; c.fillRect(-r*2.3,-r*2.3,r*4.6,r*4.6);
  c.strokeStyle=color; c.lineWidth=3;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+t*0.25;
    c.beginPath();
    c.moveTo(Math.cos(a)*r*0.82*pulse,Math.sin(a)*r*0.82*pulse);
    c.lineTo(Math.cos(a)*r*1.35*pulse,Math.sin(a)*r*1.35*pulse);
    c.stroke();
  }
  c.fillStyle=color; c.beginPath(); c.arc(0,0,r*0.95*pulse,0,TAU); c.fill();
  c.strokeStyle='rgba(255,255,255,0.6)'; c.lineWidth=2; c.beginPath(); c.arc(0,0,r*0.95*pulse,0,TAU); c.stroke();
  c.fillStyle='#fff'; c.beginPath(); c.arc(-6,-5,5,0,TAU); c.fill();
  c.globalAlpha=0.5; c.beginPath(); c.arc(7,6,3,0,TAU); c.fill();
  c.restore();
}

// ---------- 绘制：铲草机 ----------
function drawMower(c,x,y,t){
  c.save(); c.translate(x,y);
  // 轮子
  c.fillStyle='#2c2c2c'; c.beginPath(); c.arc(-12,10,9,0,TAU); c.fill();
  c.beginPath(); c.arc(12,10,9,0,TAU); c.fill();
  c.fillStyle='#5a5a5a'; c.beginPath(); c.arc(-12,10,4,0,TAU); c.fill();
  c.beginPath(); c.arc(12,10,4,0,TAU); c.fill();
  // 车身
  c.fillStyle='#c43a2a'; rr(c,-16,-4,32,16,4); c.fill();
  c.fillStyle='#e04a3a'; rr(c,-14,-8,28,6,3); c.fill();
  // 引擎盖
  c.fillStyle='#8a2418'; rr(c,-6,-10,14,4,2); c.fill();
  // 刀片
  c.save(); c.translate(0,-4); c.rotate(t*12);
  c.strokeStyle='#d8d8d8'; c.lineWidth=3;
  c.beginPath(); c.moveTo(-14,0); c.lineTo(14,0); c.stroke();
  c.beginPath(); c.moveTo(0,-14); c.lineTo(0,14); c.stroke();
  c.restore();
  c.restore();
}

function sunColor(){ return G.level.sunType==='sun'?'#ffd93d':(G.level.sunType==='moon'?'#cfe8ff':'#ffe9a8'); }
// ---------- 绘制：HUD ----------
const CARD_W=100,CARD_H=66,CARD_Y=10,CARD_X0=128,CARD_GAP=6;
function drawHUD(){
  // HUD 背景
  ctx.fillStyle=G.level.theme==='day'?'rgba(120,180,90,0.92)':'rgba(30,45,80,0.92)';
  ctx.fillRect(0,0,W,88);
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=2; ctx.strokeRect(0,0,W,88);
  // 阳光计数
  drawSunOrb(ctx,30,38,performance.now()/1000,sunColor(),G.level.sunType==='moon');
  ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=3;
  ctx.font='bold 30px "Microsoft YaHei",sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.strokeText(G.sun,52,40); ctx.fillText(G.sun,52,40);
  // 种子卡
  const keys=Object.keys(SEEDS);
  keys.forEach((key,i)=>{
    const sd=SEEDS[key];
    const x=CARD_X0+i*(CARD_W+CARD_GAP);
    const selected=G.selected===key;
    const cd=G.seedCd[key];
    const ready=cd<=0;
    const afford=G.sun>=sd.cost;
    // 卡片底
    ctx.fillStyle=selected?'#fff7d0':'#f5ecd8';
    rr(ctx,x,CARD_Y,CARD_W,CARD_H,8); ctx.fill();
    ctx.strokeStyle=selected?'#e8b41e':'#8a7a58'; ctx.lineWidth=selected?3:2;
    rr(ctx,x,CARD_Y,CARD_W,CARD_H,8); ctx.stroke();
    // 蘑菇图标
    ctx.save();
    ctx.translate(x+CARD_W/2,CARD_Y+30);
    drawSeedIcon(key,ctx);
    ctx.restore();
    // 名字
    ctx.fillStyle='#5a4a30'; ctx.font='bold 12px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(sd.name,x+CARD_W/2,CARD_Y+46);
    // 花费
    ctx.fillStyle=afford?'#2c5a10':'#b03030'; ctx.font='bold 14px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(sd.cost,x+8,CARD_Y+CARD_H-12);
    ctx.font='bold 11px sans-serif'; ctx.fillText('☀',x+30,CARD_Y+CARD_H-12);
    // 冷却遮罩
    if(cd>0){
      const p=clamp(cd/sd.cd,0,1);
      ctx.fillStyle='rgba(40,30,20,0.6)';
      rr(ctx,x,CARD_Y,CARD_W,CARD_H*p,8); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
      ctx.fillText(Math.ceil(cd).toString(),x+CARD_W/2,CARD_Y+CARD_H/2);
    }
    // 阳光不足置灰
    if(!afford&&cd<=0){
      ctx.fillStyle='rgba(120,110,90,0.35)';
      rr(ctx,x,CARD_Y,CARD_W,CARD_H,8); ctx.fill();
    }
  });
  // 暂停/声音按钮
  drawBtn(W-76,12,28,28,'⏸',G.paused);
  drawBtn(W-40,12,28,28,soundOn?'🔊':'🔇',false);
  // 进度条
  drawProgress();
}
function drawBtn(x,y,w,h,txt,active){
  ctx.fillStyle=active?'#ffe08a':'#fff8e0';
  rr(ctx,x,y,w,h,6); ctx.fill();
  ctx.strokeStyle='#8a7a58'; ctx.lineWidth=1.5; rr(ctx,x,y,w,h,6); ctx.stroke();
  ctx.fillStyle='#5a4a30'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,x+w/2,y+h/2+1);
}
function drawProgress(){
  const waves=G.level.waves.length;
  const bx=LAWN_X, by=90, bw=GRID_W, bh=7;
  ctx.fillStyle='rgba(0,0,0,0.3)'; rr(ctx,bx,by,bw,bh,3); ctx.fill();
  const seg=bw/waves;
  for(let i=0;i<waves;i++){
    const filled=i<G.clearedWaves;
    const isFlagW=G.level.waves[i].some(e=>e.z==='flag');
    if(filled){
      ctx.fillStyle='#ffd93d'; rr(ctx,bx+i*seg+1,by+1,seg-2,bh-2,2); ctx.fill();
    }else{
      ctx.fillStyle='rgba(255,255,255,0.18)'; rr(ctx,bx+i*seg+1,by+1,seg-2,bh-2,2); ctx.fill();
    }
    if(isFlagW){
      ctx.fillStyle='#ff7b45'; ctx.beginPath();
      ctx.moveTo(bx+i*seg+seg/2,by-2); ctx.lineTo(bx+i*seg+seg/2+4,by+2); ctx.lineTo(bx+i*seg+seg/2,by+6); ctx.lineTo(bx+i*seg+seg/2-4,by+2);
      ctx.closePath(); ctx.fill();
    }
  }
  if(G.waveActive){
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText('波次 '+Math.min(G.waveIndex+1,waves)+'/'+waves,bx+bw,by+3);
  }
}

// 种子图标（卡片上用）
function drawSeedIcon(key,c){
  const t=performance.now()/1000;
  c.save(); c.scale(0.5,0.5);
  if(key==='puff')   drawPuff(c,0,8,t,1,{firing:false});
  if(key==='glow')   drawGlow(c,0,8,t,1);
  if(key==='reishi') drawReishi(c,0,8,t,1,1);
  if(key==='agaric') drawAgaric(c,0,8,t,1,false);
  if(key==='truffle')drawTruffle(c,0,8,t,1,false);
  c.restore();
}

// ---------- 绘制：主渲染 ----------
function render(t){
  ctx.clearRect(0,0,W,H);
  drawBackground(t);
  if(G.state==='playing'||G.state==='intro'||G.state==='win'||G.state==='lose'){
    // 铲草机
    for(const m of G.mowers){
      if(m.state==='idle'||m.state==='active') drawMower(ctx,m.x,LAWN_Y+m.row*CELL_H+CELL_H/2+4,t);
    }
    // 种植预览
    if(G.state==='playing'&&G.selected&&G.hoverCell){
      const hc=G.hoverCell;
      const occ=G.plants.find(p=>p.row===hc.row&&p.col===hc.col)||
        G.zombies.some(z=>z.row===hc.row&&!z.dying&&z.x>hc.x-40&&z.x<hc.x+40);
      const valid=!occ&&G.sun>=SEEDS[G.selected].cost;
      ctx.save();
      ctx.globalAlpha=0.5;
      if(valid){
        const cx=hc.x, cy=hc.y-10;
        ctx.translate(cx,cy);
        ctx.scale(0.8,0.8);
        drawSeedIcon(G.selected,ctx);
      }else{
        ctx.fillStyle='rgba(220,60,40,0.4)';
        rr(ctx,hc.x-34,hc.y-42,68,84,6); ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle=valid?'rgba(120,220,90,0.9)':'rgba(220,60,40,0.9)';
      ctx.lineWidth=2;
      rr(ctx,hc.x-34,hc.y-42,68,84,6); ctx.stroke();
    }
    // 蘑菇
    for(const p of G.plants){
      const sd=SEEDS[p.key];
      ctx.save(); ctx.translate(p.x,p.y);
      const hpPct=p.hp/sd.hp;
      if(p.key==='puff')  drawPuff(ctx,0,0,p.t,1,{firing:p.fireT<0.15&&p.fireT>-0.05});
      if(p.key==='glow')  drawGlow(ctx,0,0,p.t,1);
      if(p.key==='reishi')drawReishi(ctx,0,0,p.t,1,hpPct);
      if(p.key==='agaric')drawAgaric(ctx,0,0,p.t,1,p.armed||p.explodeT>0);
      if(p.key==='truffle')drawTruffle(ctx,0,0,p.t,1,p.armed,p.armed?1:p.armT/SEEDS[p.key].arm);
      // 受击白闪
      if(p.hitFlash>0){ ctx.globalAlpha=0.5; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-12,26,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
      ctx.restore();
    }
    // 弹道（孢子）
    for(const s of G.projectiles){
      ctx.fillStyle='#7ec850';
      ctx.beginPath(); ctx.arc(s.x,s.y-8,5,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(126,200,80,0.35)';
      ctx.beginPath(); ctx.arc(s.x-3,s.y-8,9,0,TAU); ctx.fill();
      ctx.fillStyle='#eaf7d8';
      ctx.beginPath(); ctx.arc(s.x-1.5,s.y-9.5,1.6,0,TAU); ctx.fill();
    }
    // 僵尸/星球
    const zs=[...G.zombies].sort((a,b)=>(b.row===a.row?b.x-a.x:a.row-b.row));
    const sp=G.level&&G.level.theme==='space';
    for(const z of zs){
      if(sp) drawPlanet(ctx,z.x,LAWN_Y+z.row*CELL_H+CELL_H/2,z.t,z);
      else drawZombie(ctx,z.x,LAWN_Y+z.row*CELL_H+CELL_H-8,z.t,z);
    }
    // 阳光/月光/星光
    for(const s of G.suns){
      const fade=s.state==='ground'&&s.ttl<1.2?(s.ttl/1.2):1;
      ctx.globalAlpha=clamp(fade,0,1);
      drawSunOrb(ctx,s.x,s.y,s.t,sunColor(),G.level.sunType==='moon');
      ctx.globalAlpha=1;
    }
    // 粒子
    for(const p of G.particles){
      const a=clamp(p.life/p.max,0,1);
      ctx.globalAlpha=a;
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
    // 浮动文字
    for(const f of G.floats){
      const a=clamp(f.life/1,0,1);
      ctx.globalAlpha=a;
      ctx.fillStyle=f.color; ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=3;
      ctx.font='bold 18px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
      ctx.strokeText(f.str,f.x,f.y-(1-a)*26); ctx.fillText(f.str,f.x,f.y-(1-a)*26);
    }
    ctx.globalAlpha=1;
    drawHUD();
    // 波次横幅
    if(G.banner){
      const bt=G.banner.t;
      const a=clamp(Math.min(bt,2.2-bt+1.6),0,1);
      ctx.globalAlpha=a;
      ctx.font='bold '+(G.banner.big?30:24)+'px "Microsoft YaHei",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const bw=ctx.measureText(G.banner.text).width+60;
      ctx.fillStyle='rgba(20,15,10,0.72)'; rr(ctx,W/2-bw/2,62,bw,42,21); ctx.fill();
      ctx.fillStyle=G.banner.big?'#ffd93d':'#fff';
      ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=4;
      ctx.strokeText(G.banner.text,W/2,83);
      ctx.fillText(G.banner.text,W/2,83);
      ctx.globalAlpha=1;
    }
  }
  // 场景覆盖
  if(G.state==='title') drawTitle(t);
  else if(G.state==='select') drawSelect(t);
  else if(G.state==='explore') exRender(t);
  else if(G.state==='intro') drawIntro(t);
  else if(G.state==='win') drawEnd(t,true);
  else if(G.state==='lose') drawEnd(t,false);
  if(G.state==='playing'&&G.paused) drawPause();
}

function drawSelect(t){

  ctx.strokeText('选择关卡',W/2,108);
  ctx.fillStyle='#fff'; ctx.fillText('选择关卡',W/2,108);
  // 四张关卡卡片（横排缩小）
  const cards=[
    {title:'第 1 关',sub:'白天草地',desc:'新手关·10波',theme:'day',emoji:'🌞',l1:'普通/路障/铁桶/旗帜',l2:'蘑菇：马勃/荧光/灵芝/毒蝇伞/松露'},
    {title:'第 2 关',sub:'月光之夜',desc:'进阶关·12波',theme:'night',emoji:'🌙',l1:'普通/路障/铁桶/旗帜',l2:'月光会从荧光菇渗出'},
    {title:'第 3 关',sub:'星空战场',desc:'星球入侵·12波',theme:'space',emoji:'🪐',l1:'水金火木土+天王星',l2:'守护地球，抵御星球大军'},
    {title:'第 4 关',sub:'探索太阳系',desc:'自由探索·无战斗',theme:'explore',emoji:'🚀',l1:'9 大行星+月球 科普漫游',l2:'驾驶飞船，点亮整片星空'},

// 第一人称相机基向量（相机位置 + 朝向 yaw/pitch）
function exBasis(){
  const c=EX.cam;
  const px=c.cx, py=c.cy, pz=c.cz;
  const fx=Math.cos(c.pitch)*Math.sin(c.yaw);
  const fy=Math.sin(c.pitch);
  const fz=Math.cos(c.pitch)*Math.cos(c.yaw);
  let rx=-fz, rz=fx, ry=0;
  const rl=Math.sqrt(rx*rx+rz*rz)||1; rx/=rl; rz/=rl;
  let ux=ry*fz-rz*fy, uy=rz*fx-rx*fz, uz=rx*fy-ry*fx;
  const ul=Math.sqrt(ux*ux+uy*uy+uz*uz)||1; ux/=ul; uy/=ul; uz/=ul;
  EX.basis={px,py,pz,fx,fy,fz,rx,ry,rz,ux,uy,uz};
}
function exProject(p){
  const b=EX.basis;
  if(!b) return null;
  const dx=p.x-b.px, dy=p.y-b.py, dz=p.z-b.pz;
  const depth=dx*b.fx+dy*b.fy+dz*b.fz;
  if(depth<3) return null;
  const xc=dx*b.rx+dy*b.ry+dz*b.rz;
  const yc=dx*b.ux+dy*b.uy+dz*b.uz;
  const sc=EX.cam.focal/depth;
  return {x:W/2+xc*sc, y:H/2-yc*sc, scale:sc, depth};
}
function exFloat(x,y,z,str,color){
  const pr=exProject({x,y,z});
  if(pr) floatText(pr.x,pr.y-12,str,color);
}
function exBurst(x,y,z,color,big){
  const pr=exProject({x,y,z});
  if(!pr) return;
  const n=big?40:18;
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU, sp=rand(30,big?300:170);
    G.particles.push({x:pr.x,y:pr.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,life:rand(0.3,big?0.8:0.5),max:1,size:rand(3,big?8:5),color:Math.random()<0.6?color:(Math.random()<0.5?'#ffd166':'#fff')});
  }
  if(big) EX.shake=10;
}

// 更新：入场动画 / 飞船 / 天体 / 停靠 / 收集 / 陨石
function exUpdate(dt){
  EX.time+=dt;
  if(EX.shake>0) EX.shake=Math.max(0,EX.shake-dt*30);
  if(EX.cool>0) EX.cool-=dt;
  if(EX.factT>0) EX.factT-=dt;
  if(EX.accel>0) EX.accel-=dt;
  if(EX.shield>0) EX.shield-=dt;
  if(EX.state==='intro'){
    EX.introT+=dt;
    const k=EX.introT/EX.introDur;
    const e=k<1?k*k*(3-2*k):1; // smoothstep
    const cs=EX.camStart, s=EX.ship;
    EX.cam.cx=cs.x+(s.x-cs.x)*e;
    EX.cam.cy=cs.y+(s.y+30-cs.y)*e;
    EX.cam.cz=cs.z+(s.z-cs.z)*e;
    EX.cam.yaw=cs.yaw+(s.yaw-cs.yaw)*e;
    EX.cam.pitch=cs.pitch+(s.pitch-cs.pitch)*e;
    if(e>=1){ EX.state='fly'; S.select(); }
    return;
  }
  exUpdateShip(dt);
  exUpdateBodies(dt);
  exUpdateStreaks(dt);
  exUpdateDock(dt);
  exUpdateCollect(dt);
  exUpdateAsts(dt);
  if(EX.count>=EX.mainTotal && EX.state==='fly'){ EX.state='win'; S.win(); }
}
function exUpdateShip(dt){
  const s=EX.ship;
  // 左摇杆/键盘 → 移动
  let jx=0, jy=0;
  if(EX.joyMove){
    const dx=EX.joyMove.x-JOY_MOVE.x, dy=EX.joyMove.y-JOY_MOVE.y;
    const r=Math.hypot(dx,dy)||1, m=Math.min(1,r/48);
    jx=(dx/r)*m; jy=(-dy/r)*m;
  }
  if(EX.keys.up) jy=Math.max(jy,1);
  if(EX.keys.down) jy=Math.min(jy,-1);
  if(EX.keys.left) jx=Math.min(jx,-1);
  if(EX.keys.right) jx=Math.max(jx,1);
  const jl=Math.hypot(jx,jy);
  if(jl>1){ jx/=jl; jy/=jl; }
  const f=exCamDir();
  const hf=Math.hypot(f.x,f.z)||1e-6;
  const spd=EX.accel>0?560:260;
  const tvx=(f.x/hf)*jy*spd + (-f.z/hf)*jx*spd;
  const tvz=(f.z/hf)*jy*spd + (f.x/hf)*jx*spd;
  s.vx+=(tvx-s.vx)*Math.min(1,8*dt);
  s.vz+=(tvz-s.vz)*Math.min(1,8*dt);
  if(EX.stun>0){ EX.stun-=dt; s.vx*=0.75; s.vz*=0.75; }
  s.x+=s.vx*dt; s.z+=s.vz*dt;
  s.yaw=EX.cam.yaw; s.pitch=EX.cam.pitch;
  EX.cam.cx=s.x; EX.cam.cy=s.y+30; EX.cam.cz=s.z;
}
function exDiscover(b){
  EX.discovered[b.id]=true;
  if(b.main) EX.count++;
  S.discover();
  exBurst(b.x,b.y,b.z,'#ffe9a8',b.main);
  EX.fact={name:b.name,text:b.fact}; EX.factT=4.6;
}
function exUpdateBodies(dt){
  const s=EX.ship;
  for(const b of EX_BODIES){ b.rot+=dt*0.25; }
  EX_SUN.rot+=dt*0.08;
  for(const b of EX_BODIES){
    if(EX.discovered[b.id]) continue;
    const d=Math.hypot(s.x-b.x,s.y-b.y,s.z-b.z);
    if(d<b.r*5+10) exDiscover(b);
  }
  if(!EX.discovered.sun){
    const d=Math.hypot(s.x,s.y,s.z);
    if(d<EX_SUN.reach) exDiscover(EX_SUN);
  }
}
function exUpdateDock(dt){
  EX.nearPlanet=null;
  if(EX.state!=='fly') return;
  const s=EX.ship;
  const sp=Math.hypot(s.vx,s.vy,s.vz);
  // 关闭商店后需飞离该星球，否则不会再次自动停靠（避免商店反复弹出）
  if(EX.dockBlock){
    const bb=EX_BODIES.find(b=>b.id===EX.dockBlock);
    if(bb && Math.hypot(s.x-bb.x,s.y-bb.y,s.z-bb.z) > bb.r*1.8+18) EX.dockBlock=null;
  }
  let best=null, bestD=1e9;
  for(const b of EX_BODIES){
    if(!EX.discovered[b.id]||b.kind==='moon'||b.id===EX.dockBlock) continue;
    const d=Math.hypot(s.x-b.x,s.y-b.y,s.z-b.z);
    if(d<b.r*1.8+12 && d<bestD){ best=b; bestD=d; }
  }

  if(best && sp<14 && EX.cool<=0){
    EX.docked=best; EX.state='dock'; S.select();
  }
}
function exUpdateCollect(dt){
  const s=EX.ship;

    if(EX.shield>0 && d<30){
      st.x+=(s.x-st.x)*6*dt; st.y+=(s.y-st.y)*6*dt; st.z+=(s.z-st.z)*6*dt;
      d=Math.hypot(s.x-st.x,s.y-st.y,s.z-st.z);

}
// 速度线（移动风效）：飞船移动时屏幕周边出现流动线条
function exUpdateStreaks(dt){
  const s=EX.ship;
  const sp=Math.hypot(s.vx,s.vy,s.vz);
  let mdx=0, mdy=0;
  exBasis();
  const pA=exProject(s);
  const pB=exProject({x:s.x+s.vx*2, y:s.y+s.vy*2, z:s.z+s.vz*2});
  if(pA&&pB){ mdx=pB.x-pA.x; mdy=pB.y-pA.y; }
  const ml=Math.hypot(mdx,mdy)||1;
  const nx=-mdx/ml, ny=-mdy/ml; // 与运动方向相反
  if(sp>60){
    EX.streakAcc+=Math.min(46, sp*0.35)*dt;
    while(EX.streakAcc>1){
      EX.streakAcc--;
      const a=Math.random()*TAU, rr0=0.35+Math.random()*0.65;
      const px=W/2+Math.cos(a)*W*0.5*rr0;
      const py=H/2+Math.sin(a)*H*0.5*rr0;
      const vv=(120+Math.random()*200)*(sp/260);
      EX.streaks.push({x:px,y:py,nx,ny,vx:nx*vv,vy:ny*vv,life:0.5,len:rand(12,32),a:rand(0.2,0.4)});
    }
  }
  for(const st of EX.streaks){ st.x+=st.vx*dt; st.y+=st.vy*dt; st.life-=dt; }
  EX.streaks=EX.streaks.filter(st=>st.life>0);
}
function exDrawStreaks(){
  for(const st of EX.streaks){
    const a=clamp(st.life/0.5,0,1)*st.a;
    ctx.globalAlpha=a;
    ctx.strokeStyle='#cfe8ff';
    ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(st.x-st.nx*st.len, st.y-st.ny*st.len);
    ctx.lineTo(st.x, st.y);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function exUpdateAsts(dt){  const s=EX.ship;
  for(const p of EX.belts){
    p.a+=p.sp*dt/p.r0;
    p.x=Math.cos(p.a)*p.r0; p.z=Math.sin(p.a)*p.r0;
  }
  for(const a of EX.asts){
    a.x+=a.vx*dt; a.z+=a.vz*dt; a.t+=dt;
    const d=Math.hypot(s.x-a.x,s.y-a.y,s.z-a.z);
    if(d<a.r+3){
      if(EX.shield>0){
        exBurst(a.x,a.y,a.z,'#9fd8ff',false);
      }else{
        const dx=s.x-a.x, dy=s.y-a.y, dz=s.z-a.z;
        const l=Math.hypot(dx,dy,dz)||1;
        s.vx=dx/l*260; s.vy=dy/l*110; s.vz=dz/l*260;
        EX.stun=0.7; EX.shake=9; S.explode();
        exBurst(s.x,s.y,s.z,'#ffb45c',true);
      }
    }
  }
}

function exRender(t){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(EX.shake>0) ctx.translate(rand(-EX.shake,EX.shake),rand(-EX.shake,EX.shake));
  exDrawSpace(t);
  exBasis();
  exDrawBelts(t);
  // 轨道环线（史诗感：勾勒整个太阳系）
  for(const b of EX_BODIES) if(b.main) exDrawOrbit(b);
  const items=[];
  const addP=(p,f)=>{ const pr=exProject(p); if(pr) items.push({pr,d:f}); };
  addP(EX_SUN,()=>exDrawBody(EX_SUN,EX_SUN.rot,t));
  for(const b of EX_BODIES) addP(b,()=>exDrawBody(b,b.rot,t));
  for(const a of EX.asts) addP(a,()=>exDrawAsteroid(a,t));
  for(const st of EX.stars) if(!st.got) addP(st,()=>exDrawStar(st,t));
  // 第一视角时飞船在镜头内不绘制（接近时淡出）；入场/远景时可见
  const s=EX.ship;
  const camDist=Math.hypot(EX.cam.cx-s.x,EX.cam.cy-s.y,EX.cam.cz-s.z);
  if(camDist>30) addP(s,()=>{ ctx.globalAlpha=clamp((camDist-30)/50,0,1); exDrawShip(t); ctx.globalAlpha=1; });
  items.sort((p,q)=>q.pr.depth-p.pr.depth);
  for(const it of items) it.d();
  ctx.restore();
  if(EX.factT>0 && EX.fact) exDrawFact();
  exDrawHUD(t);
  if(EX.state==='intro') exDrawIntro(t);
  if(EX.state==='fly'){
    // 速度线（移动风效）
    exDrawStreaks();
    // 第一视角准星
    ctx.strokeStyle='rgba(255,233,168,0.75)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(W/2,H/2,5,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2-10,H/2); ctx.lineTo(W/2-4,H/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2+4,H/2); ctx.lineTo(W/2+10,H/2); ctx.stroke();
    // 第一视角飞船机头（随俯仰上下倾斜，体现 z 轴朝向）
    exDrawCockpit();
  }
  if(EX.state==='dock') exDrawStore();
  if(EX.state==='win') exDrawWin();
}

function exDrawStar(st,t){
  const pr=exProject(st); if(!pr) return;

  const tw=0.6+0.4*Math.sin(t*3+st.t*7);

  const s=Math.max(2,5*sc*tw);

  ctx.textAlign='center';
  ctx.fillStyle='#cfe8ff';
  ctx.fillText('已探索 '+EX.count+'/'+EX.mainTotal+'  ·  '+(EX.count>=EX.mainTotal?'⭐ 目标达成':'继续探索'),W/2,30);
  let ab='';
  if(EX.accel>0) ab+='🚀 加速 '+EX.accel.toFixed(1)+'s   ';
  if(EX.shield>0) ab+='🛡️ 护盾 '+EX.shield.toFixed(1)+'s';
  ctx.textAlign='left'; ctx.fillStyle='#ffd166';
  if(ab) ctx.fillText(ab,16,54);
  drawBtn(W-84,10,72,26,'↩ 回选关',false);
  if(EX.nearPlanet && EX.state==='fly'){
    ctx.textAlign='center'; ctx.font='13px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#ffe9a8'; ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=3;
    const msg='🌍 已靠近「'+EX.nearPlanet.name+'」 减速即可停靠商店';
    ctx.strokeText(msg,W/2,H-44); ctx.fillText(msg,W/2,H-44);
  }
  // 虚拟摇杆（仅飞行状态）：左侧移动摇杆；转视角直接用拖动
  if(EX.state==='fly'){
    const bx=JOY_MOVE.x, by=JOY_MOVE.y;
    ctx.globalAlpha=0.35;
    ctx.strokeStyle='#9fd8ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bx,by,44,0,TAU); ctx.stroke();
    ctx.fillStyle='#9fd8ff';
    ctx.font='bold 15px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
    ctx.fillText('移动',bx,by+62);
    ctx.globalAlpha=0.85;
    if(EX.joyMove){
      let dx=EX.joyMove.x-bx, dy=EX.joyMove.y-by;
      const r=Math.hypot(dx,dy);
      if(r>44){ dx=dx/r*44; dy=dy/r*44; }
      ctx.fillStyle='rgba(159,216,255,0.5)';
      ctx.beginPath(); ctx.arc(bx+dx,by+dy,20,0,TAU); ctx.fill();
      ctx.strokeStyle='#cfe8ff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(bx+dx,by+dy,20,0,TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}
function exDrawStore(){
  const b=EX.docked;
  ctx.fillStyle='rgba(8,10,22,0.66)'; ctx.fillRect(0,0,W,H);
  const pw=440, ph=270, x=W/2-pw/2, y=H/2-ph/2;
  ctx.fillStyle='#141a38'; rr(ctx,x,y,pw,ph,16); ctx.fill();
  ctx.strokeStyle='#3a5a8a'; ctx.lineWidth=2; rr(ctx,x,y,pw,ph,16); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffe9a8'; ctx.font='bold 22px "Microsoft YaHei",sans-serif';
  ctx.fillText('🪐 '+b.name+' 太空站',W/2,y+34);
  ctx.font='14px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#cfe8ff';
  ctx.fillText('用星尘兑换临时能力（✦ 拥有 '+EX.stardust+'）',W/2,y+64);
  const items=[
    {name:'🚀 加速',desc:'5 秒内飞行速度翻倍',cost:20,fn:()=>EX.accel=5},
    {name:'🛡️ 护盾',desc:'8 秒免陨石干扰并磁吸星尘',cost:15,fn:()=>EX.shield=8},
  ];
  const iw=180, ih=110, gx=20, iy=y+92;
  for(let i=0;i<2;i++){
    const it=items[i];
    const ix=x+gx+i*(iw+gx);
    const afford=EX.stardust>=it.cost;
    ctx.fillStyle=afford?'#22315a':'#2a2a38';
    rr(ctx,ix,iy,iw,ih,12); ctx.fill();
    ctx.strokeStyle=afford?'#5a8ac8':'#55555f'; ctx.lineWidth=2; rr(ctx,ix,iy,iw,ih,12); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 17px "Microsoft YaHei",sans-serif';
    ctx.fillText(it.name,ix+iw/2,iy+30);
    ctx.font='12px "Microsoft YaHei",sans-serif'; ctx.fillStyle=afford?'#cfe8ff':'#8890a8';
    ctx.fillText(it.desc,ix+iw/2,iy+58);
    ctx.fillStyle=afford?'#ffe9a8':'#ff8c8c';
    ctx.font='bold 16px "Microsoft YaHei",sans-serif';
    ctx.fillText(it.cost+' ✦',ix+iw/2,iy+86);
  }
  ctx.fillStyle='#e8e0d0'; rr(ctx,W/2-60,y+ph-58,120,36,18); ctx.fill();
  ctx.strokeStyle='#8a7a58'; ctx.lineWidth=2; rr(ctx,W/2-60,y+ph-58,120,36,18); ctx.stroke();
  ctx.fillStyle='#5a4a30'; ctx.font='bold 16px "Microsoft YaHei",sans-serif';
  ctx.fillText('关闭离开',W/2,y+ph-40);
}
function exDrawFact(){
  if(!EX.fact) return;
  const a=clamp(Math.min(EX.factT,4.6-EX.factT+1),0,1);
  ctx.globalAlpha=a;
  const f=EX.fact;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(10,14,30,0.72)'; rr(ctx,W/2-300,64,600,86,16); ctx.fill();
  ctx.strokeStyle='rgba(255,233,168,0.6)'; ctx.lineWidth=2; rr(ctx,W/2-300,64,600,86,16); ctx.stroke();
  ctx.fillStyle='#ffe066';
  ctx.font='bold 24px "Microsoft YaHei",sans-serif';
  ctx.fillText('🔭 发现 '+f.name+'！',W/2,94);
  ctx.fillStyle='#fff'; ctx.font='14px "Microsoft YaHei",sans-serif';
  ctx.fillText(f.text,W/2,130);
  ctx.globalAlpha=1;
}
function exDrawWin(){
  ctx.fillStyle='rgba(8,10,22,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 42px "Microsoft YaHei",sans-serif';
  ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=8;
  ctx.strokeText('🎉 太阳系探索完成！',W/2,180);
  ctx.fillStyle='#ffe066'; ctx.fillText('🎉 太阳系探索完成！',W/2,180);
  ctx.font='18px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#fff';
  ctx.fillText('你点亮了全部 9 颗主线天体 · 用时 '+Math.floor(EX.time)+' 秒 · 收获星尘 '+EX.stardust,W/2,244);
  ctx.fillStyle='#cfe8ff'; ctx.font='14px "Microsoft YaHei",sans-serif';
  ctx.fillText('（支线：月球、太阳等天体还可继续探索）',W/2,276);
  ctx.fillStyle='rgba(255,217,61,0.92)'; rr(ctx,W/2-110,332,220,56,28); ctx.fill();
  ctx.strokeStyle='#8a6a10'; ctx.lineWidth=3; rr(ctx,W/2-110,332,220,56,28); ctx.stroke();
  ctx.font='bold 22px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#5a3a00';
  ctx.fillText('↩ 返回选关',W/2,360);
}

// 探索模式输入：左摇杆/WASD 移动 · 按住任意处拖动转视角 · 滚轮缩放
function exCamDir(){
  return {x:Math.cos(EX.cam.pitch)*Math.sin(EX.cam.yaw),
          y:Math.sin(EX.cam.pitch),
          z:Math.cos(EX.cam.pitch)*Math.cos(EX.cam.yaw)};
}
function exPointerMove(mx,my,id){
  G.mouse.x=mx; G.mouse.y=my;
  if(EX.joyMove && EX.joyMove.id===id){ EX.joyMove.x=mx; EX.joyMove.y=my; }
  if(EX.look && EX.look.id===id){
    const dx=mx-EX.look.lx, dy=my-EX.look.ly;
    EX.look.lx=mx; EX.look.ly=my;
    EX.cam.yaw-=dx*0.0055;
    EX.cam.pitch=clamp(EX.cam.pitch-dy*0.0055,-1.5,1.5);
  }
  // 拖动超过阈值则视为拖动（点击行星开商店的意图取消）
  if(EX.tapPlanet && EX.tapPlanet.id===id && !EX.tapPlanet.moved &&
     Math.hypot(mx-EX.tapPlanet.px,my-EX.tapPlanet.py)>7) EX.tapPlanet.moved=true;
}
function exHandleDown(mx,my,id,pointerType){
  if(EX.state==='win'){
    if(mx>W/2-110&&mx<W/2+110&&my>332&&my<388){ setHint(HINT_BATTLE); G.state='select'; S.select(); }
    return;
  }
  if(EX.state==='dock'){
    const pw=440, ph=270, x=W/2-pw/2, y=H/2-ph/2;
    const items=[{cost:20,fn:()=>{EX.accel=5; S.boost();}},{cost:15,fn:()=>{EX.shield=8; S.buy();}}];
    const iw=180, ih=110, iy=y+92;
    for(let i=0;i<2;i++){
      const ix=x+20+i*(iw+20);
      if(mx>ix&&mx<ix+iw&&my>iy&&my<iy+ih){
        const it=items[i];
        if(EX.stardust>=it.cost){ EX.stardust-=it.cost; it.fn(); S.select(); exFloat(EX.ship.x,EX.ship.y,EX.ship.z,'已购买！','#9fd8ff'); }
        else S.invalid();
        return;
      }
    }
    if(mx>W/2-60&&mx<W/2+60&&my>y+ph-58&&my<y+ph-22){ EX.dockBlock=EX.docked?EX.docked.id:null; EX.docked=null; EX.state='fly'; EX.cool=1.5; S.select(); }
    return;
  }
  if(my<60 && mx>W-84 && mx<W-12){ setHint(HINT_BATTLE); G.state='select'; S.select(); return; }
  if(EX.state!=='fly') return;
  // 记录可能点按到的行星（点击才开商店，拖动视为转视角/移动，不弹商店）
  if(EX.basis){
    let best=null, bestD=1e9;
    for(const pb of EX_BODIES){
      if(!EX.discovered[pb.id]) continue;
      const pr=exProject(pb);
      const d=pr?Math.hypot(mx-pr.x,my-pr.y):1e9;
      const th=Math.max(20,pb.r*(pr?pr.scale:1)*1.6);
      if(pr && d<th && d<bestD){ best=pb; bestD=d; }
    }
    if(best) EX.tapPlanet={id, body:best, px:mx, py:my, moved:false};
  }
  // 触摸：左半屏=移动摇杆，右半屏=拖动转视角；鼠标：点到摇杆底座=移动，其余拖动=转视角
  if(pointerType==='touch'){
    if(mx<W/2){
      if(!EX.joyMove) EX.joyMove={id, x:mx, y:my};
    }else if(!EX.look){
      EX.look={id, lx:mx, ly:my};
    }
  }else{
    if(Math.hypot(mx-JOY_MOVE.x,my-JOY_MOVE.y)<56 && !EX.joyMove){
      EX.joyMove={id, x:mx, y:my};
    }else if(!EX.look){
      EX.look={id, lx:mx, ly:my};
    }
  }
}
function exPointerUp(id){
  if(EX.tapPlanet && EX.tapPlanet.id===id){
    if(!EX.tapPlanet.moved){ EX.docked=EX.tapPlanet.body; EX.state='dock'; S.select(); }
    EX.tapPlanet=null;
  }
  if(EX.joyMove && EX.joyMove.id===id) EX.joyMove=null;
  if(EX.look && EX.look.id===id) EX.look=null;
}
function exPointerCancel(id){
  if(EX.tapPlanet && EX.tapPlanet.id===id) EX.tapPlanet=null;
  if(EX.joyMove && EX.joyMove.id===id) EX.joyMove=null;
  if(EX.look && EX.look.id===id) EX.look=null;
}

// ---------- 主循环 ----------
function update(dt){
  G.time+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);
  // 浮动文字/粒子 始终更新
  for(const f of G.floats){ f.life-=dt; }
  G.floats=G.floats.filter(f=>f.life>0);
  for(const p of G.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=240*dt; p.life-=dt; }
  G.particles=G.particles.filter(p=>p.life>0);
  if(G.state==='explore'){ exUpdate(dt); return; }
  if(G.state==='intro'){
    G.introT+=dt;
    if(G.introT>1.2){ G.state='playing'; G.waveDelay=6; }
    updateSuns(dt);
    return;
  }
  if(G.state==='playing'){
    if(G.paused) return;
    // 冷却
    for(const k in G.seedCd) if(G.seedCd[k]>0) G.seedCd[k]-=dt;
    updateSuns(dt);
    updatePlants(dt);
    updateProjectiles(dt);
    updateZombies(dt);
    updateWaves(dt);
    checkWin();
    // 植物受击闪烁
    for(const p of G.plants){ if(p.hitFlash>0)p.hitFlash-=dt; }
    // 僵尸旗帜
    for(const z of G.zombies){ if(z.flagRaise<1) z.flagRaise+=dt*1.5; }
  }
  if(G.state==='win'||G.state==='lose'){
    updateSuns(dt);
    for(const z of G.zombies){ if(z.dying){z.deathT+=dt;} }
    G.zombies=G.zombies.filter(z=>z.deathT<1.15);
  }
}
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  update(dt);
  ctx.save();
  if(G.shake>0) ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
  render(now/1000);
  ctx.restore();
  requestAnimationFrame(loop);
}

// ---------- 输入（Pointer Events 统一鼠标/触控） ----------
function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
function updateHover(mx,my){
  G.mouse.x=mx; G.mouse.y=my;
  if(mx>LAWN_X&&mx<LAWN_X+GRID_W&&my>LAWN_Y&&my<LAWN_Y+GRID_H){
    const cc=cellCenter(colOf(mx),rowOf(my));
    G.hoverCell={x:cc.x,y:cc.y,col:colOf(mx),row:rowOf(my)};
  }else G.hoverCell=null;
}
canvas.addEventListener('pointermove',e=>{
  const p=pointerPos(e);
  if(G.state==='explore') exPointerMove(p.x,p.y,e.pointerId);
  else updateHover(p.x,p.y);
});
canvas.addEventListener('pointerup',e=>{ if(G.state==='explore') exPointerUp(e.pointerId); });
canvas.addEventListener('pointercancel',e=>{ if(G.state==='explore') exPointerCancel(e.pointerId); });
canvas.addEventListener('wheel',e=>{
  if(G.state==='explore'){ e.preventDefault(); EX.cam.focal=clamp(EX.cam.focal*Math.exp(e.deltaY*0.0012),250,950); }
},{passive:false});
canvas.addEventListener('pointerdown',e=>{
  // 鼠标右键 = 取消选择；触摸不区分按键
  if(e.pointerType==='mouse'&&e.button===2){ G.selected=null; return; }
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  const p=pointerPos(e);
  if(G.state==='explore'){ exHandleDown(p.x,p.y,e.pointerId,e.pointerType); return; }
  updateHover(p.x,p.y);
  handleClick(p.x,p.y);
});
canvas.addEventListener('contextmenu',e=>{e.preventDefault(); G.selected=null;});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); if(G.state==='playing') G.paused=!G.paused; }
  const map={'Digit1':'puff','Digit2':'glow','Digit3':'reishi','Digit4':'agaric','Digit5':'truffle'};
  if(map[e.code]&&(G.state==='playing'||G.state==='intro')){
    G.selected=G.selected===map[e.code]?null:map[e.code]; S.select();
  }
  if(G.state==='explore'){
    const k=EX.keys;
    if(e.code==='KeyW'||e.code==='ArrowUp') k.up=true;
    if(e.code==='KeyS'||e.code==='ArrowDown') k.down=true;
    if(e.code==='KeyA'||e.code==='ArrowLeft') k.left=true;
    if(e.code==='KeyD'||e.code==='ArrowRight') k.right=true;
  }
});
document.addEventListener('keyup',e=>{
  if(G.state==='explore'){
    const k=EX.keys;
    if(e.code==='KeyW'||e.code==='ArrowUp') k.up=false;
    if(e.code==='KeyS'||e.code==='ArrowDown') k.down=false;
    if(e.code==='KeyA'||e.code==='ArrowLeft') k.left=false;
    if(e.code==='KeyD'||e.code==='ArrowRight') k.right=false;
  }
});
function handleClick(mx,my){
  if(G.state==='explore'){ exHandleDown(mx,my); return; }
  if(G.state==='title'){
    if(mx>W/2-110&&mx<W/2+110&&my>420&&my<476){ G.state='select'; S.select(); }
    return;
  }
  if(G.state==='select'){
    const cw=180,gap=16,x0=16,y=200;
    for(let i=0;i<4;i++){
      const x=x0+i*(cw+gap);
      if(mx>x&&mx<x+cw&&my>y&&my<y+300){
        if(i<3) startLevel(i); else startExplore();
        S.select(); return;
      }
    }
    return;
  }
  if(G.state==='win'||G.state==='lose'){
    const win=G.state==='win'; const btnY=win?340:320;
    if(mx>W/2-250&&mx<W/2-30&&my>btnY&&my<btnY+56){ startLevel(G.lvlIdx); }
    else if(mx>W/2+30&&mx<W/2+250&&my>btnY&&my<btnY+56){
      if(win&&G.lvlIdx<LEVELS.length-1) startLevel(G.lvlIdx+1);
      else G.state='select';
    }
    return;
  }
  if(G.state==='playing'){
    if(G.paused){
      if(my<88&&mx>W-76&&mx<W-48){ /*暂停钮*/ G.paused=false; }
      else if(my<88&&mx>W-40&&mx<W-12){ soundOn=!soundOn; }
      else { G.paused=false; }
      return;
    }
    // HUD 按钮
    if(my<88){
      if(mx>W-76&&mx<W-48){ G.paused=true; return; }
      if(mx>W-40&&mx<W-12){ soundOn=!soundOn; return; }
    }
    // 阳光优先
    for(const s of G.suns){
      if(Math.hypot(mx-s.x,my-s.y)<34){ collectSun(s); return; }
    }
    // 种子卡
    if(my<88){
      const idx=Math.floor((mx-CARD_X0)/(CARD_W+CARD_GAP));
      if(idx>=0&&idx<Object.keys(SEEDS).length){
        const key=Object.keys(SEEDS)[idx];
        G.selected=G.selected===key?null:key;
        S.select();
      }
      return;
    }
    // 草坪种植
    if(G.hoverCell&&G.selected){
      plantSeed(G.hoverCell);
    }else if(G.hoverCell&&!G.selected){
      // 点击草坪无选择时无操作
    }
  }
}

// ---------- 启动 ----------
clearEntities();
G.state='select';
// 画面等比铺满窗口
function fitCanvas(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H);
  canvas.style.width=Math.floor(W*s)+'px';
  canvas.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',fitCanvas);
fitCanvas();
requestAnimationFrame(loop);
</script>
